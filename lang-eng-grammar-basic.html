<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>TOEIC 500点突破・基礎英文法特訓（厳選120問）</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap');
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      background-color: #080c14;
      color: #e2e8f0;
      user-select: none;
    }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-frame {
      background: rgba(14, 21, 37, 0.95);
      border: 1px solid rgba(56, 189, 248, 0.25);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 sm:p-5 selection:bg-cyan-500 selection:text-slate-950">

  <!-- ================= 最上部ヘッダー ================= -->
  <header class="w-full max-w-xl mx-auto flex items-center justify-between pb-3 border-b border-slate-800/80 gap-2">
    <!-- 左：戻る + タイトル -->
    <div class="flex items-center gap-2.5 shrink-0">
      <a href="index.html" class="text-slate-400 hover:text-white transition text-lg p-1" title="ポータルへ戻る">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <h1 class="text-base sm:text-lg font-black tracking-wide text-white flex items-center gap-2">
        <span class="text-cyan-400"><i class="fa-solid fa-seedling"></i></span>
        <span>TOEIC 500点基礎特訓</span>
      </h1>
    </div>

    <!-- 右：文字サイズ + 一覧ボタン -->
    <div class="flex items-center gap-1.5 shrink-0">
      <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg overflow-hidden text-xs">
        <button onclick="adjustFontSize(-1)" class="px-2.5 py-1.5 text-slate-300 hover:text-white hover:bg-slate-800 transition font-bold" title="文字を小さく">A-</button>
        <button onclick="adjustFontSize(1)" class="px-2.5 py-1.5 text-slate-300 hover:text-white hover:bg-slate-800 transition border-l border-slate-800 font-bold" title="文字を大きく">A+</button>
      </div>
      <button onclick="openListModal()" class="px-3 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 hover:text-white text-xs font-bold flex items-center gap-1 transition">
        <i class="fa-solid fa-list-ul text-cyan-400"></i> 一覧
      </button>
    </div>
  </header>

  <!-- ================= セレクター（2段構成） ================= -->
  <section class="w-full max-w-xl mx-auto pt-3 pb-1 space-y-2.5">
    <div class="bg-slate-900/90 p-3 rounded-2xl border border-slate-800 space-y-2">
      <!-- 1段目：大分類カテゴリ選択 -->
      <div class="flex items-center gap-2">
        <label for="categorySelect" class="text-xs text-sky-400 font-bold shrink-0 w-16">
          <i class="fa-solid fa-layer-group mr-1"></i>ジャンル:
        </label>
        <select id="categorySelect" onchange="onCategoryChange(this.value)" 
          class="bg-slate-950 text-white border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold focus:outline-none focus:border-cyan-400 flex-1">
          <option value="all">★ 全120問一括ランダム演習</option>
          <option value="cat_pos">1. 日本語でわかる品詞識別特訓</option>
          <option value="cat_sv">2. 主語・動詞の発見と基本時制</option>
          <option value="cat_pronoun">3. 代名詞の格変化（主格・所有格・目的格）</option>
          <option value="cat_prep_conj">4. 基本前置詞と等位接続詞</option>
          <option value="cat_verb">5. 助動詞・不定詞・動名詞の超頻出形</option>
        </select>
      </div>

      <!-- 2段目：論点ブロック選択 -->
      <div class="flex items-center gap-2">
        <label for="chapterSelect" class="text-xs text-amber-400 font-bold shrink-0 w-16">
          <i class="fa-solid fa-bookmark mr-1"></i>論点集:
        </label>
        <select id="chapterSelect" onchange="changeChapter(this.value)" 
          class="bg-slate-950 text-cyan-300 border border-slate-700 rounded-xl px-3 py-2 text-xs sm:text-sm font-bold focus:outline-none focus:border-cyan-400 flex-1 truncate">
          <!-- JSで動的生成 -->
        </select>
      </div>
    </div>
  </section>

  <!-- ================= メインエリア ================= -->
  <main class="w-full max-w-xl mx-auto my-auto py-1 flex flex-col items-center flex-1 justify-center">
    
    <!-- サブコントロールバー -->
    <div class="w-full flex items-center justify-between mb-2.5 text-xs px-1">
      <div class="flex items-center gap-2 font-mono">
        <span class="text-cyan-400 font-bold text-sm" id="progressIndex">0 / 0</span>
        <span class="text-slate-600">|</span>
        <label for="deckSizeSelect" class="text-slate-400">出題:</label>
        <select id="deckSizeSelect" onchange="changeDeckSize(this.value)" 
          class="bg-slate-900 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 text-xs focus:outline-none font-bold">
          <option value="10">10問</option>
          <option value="20">20問</option>
          <option value="30">30問</option>
          <option value="all" selected>全問</option>
        </select>
      </div>

      <div class="flex items-center gap-1.5">
        <button onclick="setFilterMode('all')" id="btnFilterAll" 
          class="px-3 py-1 rounded-lg text-xs font-bold bg-cyan-600 text-white transition">
          すべて
        </button>
        <button onclick="setFilterMode('review')" id="btnFilterReview" 
          class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
          <i class="fa-solid fa-xmark text-rose-500"></i> 要復習 (<span id="unmasteredBadge">0</span>)
        </button>
      </div>
    </div>

    <!-- ================= 3Dカード本体 ================= -->
    <div class="w-full min-h-[410px] sm:min-h-[420px] perspective-1000 cursor-pointer" onclick="flipCard()">
      <div id="flashCard" class="w-full h-full relative transform-style-3d transition-transform duration-500 rounded-2xl">

        <!-- 【表面】論点・例文・問題文 -->
        <div class="card-frame rounded-2xl p-5 sm:p-6 flex flex-col justify-between items-center text-center min-h-[410px] sm:min-h-[420px]">
          <!-- 上部バッジ -->
          <div class="w-full flex items-center justify-between gap-2">
            <span id="cardCategoryBadge" class="text-xs font-bold px-3 py-1 rounded-full bg-cyan-950 text-cyan-300 border border-cyan-800 truncate max-w-[240px]">
              基礎論点
            </span>
            <div class="flex items-center gap-2 shrink-0">
              <button onclick="playSpeech(event)" class="text-slate-400 hover:text-cyan-300 transition text-base p-1" title="音声再生">
                <i class="fa-solid fa-volume-high"></i>
              </button>
              <span id="cardStatusBadge" class="text-xs font-bold px-2 py-0.5 rounded bg-rose-950 text-rose-400 border border-rose-900 hidden">
                要復習
              </span>
            </div>
          </div>

          <!-- 中央：例文 ＆ 問題文 -->
          <div class="my-auto py-2 w-full space-y-3.5">
            <!-- コア論点 & 基礎例文 -->
            <div class="bg-slate-900/80 rounded-xl p-3 sm:p-3.5 border border-slate-800 text-left space-y-1.5">
              <div class="text-xs text-amber-400 font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-lightbulb"></i> <span id="cardTopicTitle">着眼点</span>
              </div>
              <div id="cardExampleEn" class="text-sm sm:text-base font-semibold text-slate-100 leading-relaxed italic">
                -
              </div>
              <div id="cardExampleJa" class="text-xs sm:text-sm text-slate-400 leading-normal">
                -
              </div>
            </div>

            <!-- 問題文エリア -->
            <div class="space-y-2 pt-1 text-left">
              <div class="text-[11px] font-bold text-sky-400 uppercase tracking-wider">
                <i class="fa-solid fa-crosshairs mr-1"></i> Part 5 基礎実践問題:
              </div>
              <div id="cardQuestion" class="font-bold text-white text-base sm:text-lg tracking-tight leading-relaxed transition-all duration-200">
                問題を読み込んでいます...
              </div>
              <div id="cardOptions" class="block p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs sm:text-sm font-mono text-cyan-300 text-center tracking-wide">
                [ - ]
              </div>
            </div>
          </div>

          <!-- 最下部案内 -->
          <div class="text-xs text-slate-400 font-bold">
            <i class="fa-solid fa-rotate mr-1"></i> タップして解答・解説を確認
          </div>
        </div>

        <!-- 【裏面】解答・解法ルール -->
        <div class="absolute inset-0 backface-hidden rotate-y-180 card-frame rounded-2xl p-5 sm:p-6 flex flex-col justify-between items-center text-center min-h-[410px] sm:min-h-[420px] border-emerald-500/40 bg-slate-950">
          <div class="w-full flex items-center justify-between pb-2 border-b border-slate-800">
            <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-1.5">
              <i class="fa-solid fa-circle-check"></i> 正解 ＆ 解法ポイント
            </span>
            <span class="text-xs text-slate-400">タップで問題へ戻る</span>
          </div>

          <!-- 解答本体 -->
          <div class="my-auto py-2 w-full space-y-3 text-left">
            <div>
              <div class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-0.5">正解</div>
              <div id="cardAnswer" class="text-2xl sm:text-3xl font-black text-emerald-300 font-mono tracking-wide">
                -
              </div>
            </div>

            <!-- ルール解説 -->
            <div class="bg-slate-900 p-3 sm:p-4 rounded-xl border border-slate-800 space-y-1">
              <div class="text-xs text-amber-400 font-bold uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-key"></i> 瞬時に見抜く解法ルール:
              </div>
              <div id="cardRule" class="text-sm sm:text-base font-bold text-slate-200 leading-relaxed">
                -
              </div>
            </div>

            <!-- 完成文 & 日本語訳枠（追加） -->
            <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 space-y-1.5">
              <div>
                <div class="text-[11px] text-slate-400 font-bold mb-0.5">完成した文:</div>
                <div id="cardFullSentence" class="text-xs sm:text-sm text-slate-300 italic leading-relaxed">
                  -
                </div>
              </div>
              <div class="pt-1.5 border-t border-slate-800/80">
                <div class="text-[11px] text-emerald-400 font-bold mb-0.5">日本語訳:</div>
                <div id="cardFullSentenceJa" class="text-xs sm:text-sm text-slate-200 leading-relaxed">
                  -
                </div>
              </div>
            </div>
          </div>

          <div class="text-xs text-slate-400 font-bold">
            下のボタンで習得状況を記録してください
          </div>
        </div>

      </div>
    </div>

    <!-- ================= 判定ボタン ================= -->
    <div class="w-full grid grid-cols-2 gap-3 mt-3.5">
      <button onclick="handleGrade(false)" 
        class="py-4 px-4 rounded-2xl bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800 text-rose-300 font-black text-sm sm:text-base transition flex items-center justify-center gap-2 shadow-lg active:scale-95">
        <i class="fa-solid fa-xmark text-rose-500 text-lg"></i>
        <span>迷った・要復習 (↓)</span>
      </button>
      <button onclick="handleGrade(true)" 
        class="py-4 px-4 rounded-2xl bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-800 text-emerald-300 font-black text-sm sm:text-base transition flex items-center justify-center gap-2 shadow-lg active:scale-95">
        <i class="fa-solid fa-check text-emerald-400 text-lg"></i>
        <span>即答できた (↑)</span>
      </button>
    </div>

    <!-- ================= ナビゲーション操作ボタン ================= -->
    <div class="w-full flex items-center justify-center gap-3 mt-2.5 mb-4">
      <button onclick="prevCard()" class="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 text-xs sm:text-sm font-bold transition flex items-center gap-1.5 active:scale-95">
        <i class="fa-solid fa-chevron-left text-xs"></i> 前へ
      </button>
      <button onclick="flipCard()" class="flex-1 max-w-[200px] py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white text-xs sm:text-sm font-black transition flex items-center justify-center gap-2 shadow-lg shadow-cyan-900/30 active:scale-95">
        <i class="fa-solid fa-rotate"></i> めくる (Space)
      </button>
      <button onclick="nextCard()" class="px-5 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 text-xs sm:text-sm font-bold transition flex items-center gap-1.5 active:scale-95">
        次へ <i class="fa-solid fa-chevron-right text-xs"></i>
      </button>
    </div>

  </main>

  <!-- ================= 問題・答えの一覧モーダル ================= -->
  <div id="listModal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="max-w-xl w-full h-[85vh] card-frame rounded-2xl p-4 sm:p-5 flex flex-col border border-slate-800 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-layer-group text-cyan-400"></i>
          <h3 class="text-sm sm:text-base font-bold text-white">基礎論点一覧</h3>
          <span class="text-xs text-slate-500 font-mono" id="modalListCount"></span>
        </div>
        <button onclick="closeListModal()" class="text-slate-400 hover:text-white text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="py-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-500"></i>
          <input type="text" id="listSearchInput" oninput="filterList()" placeholder="キーワード、問題文、正解で検索..." 
            class="w-full pl-8 pr-3 py-2 rounded-xl bg-slate-900 border border-slate-700 text-xs text-white placeholder:text-slate-600 focus:outline-none focus:border-cyan-500">
        </div>
      </div>

      <div class="flex-1 overflow-y-auto space-y-2.5 pr-1" id="listContainer"></div>
    </div>
  </div>

  <!-- フッター -->
  <footer class="mt-6 text-center text-xs text-slate-500 py-6 border-t border-slate-800 space-y-2">
    <p class="font-bold text-slate-400">&copy; 2026 TOEIC 500点基礎突破トレーニング</p>
    <p class="text-[11px] text-slate-600">中学・高校初級英語からやり直す品詞・基本文法即答システム</p>
  </footer>

  <!-- ================= スクリプト制御 ================= -->
  <script>
    const GRAMMAR_FILES = {
      block1_pos: 'eng_grammar-basic_block1_pos.json',
      block2_sv: 'eng_grammar-basic_block2_sv_tense.json',
      block3_pronoun: 'eng_grammar-basic_block3_pronouns.json',
      block4_prep: 'eng_grammar-basic_block4_prep_conj.json',
      block5_verb: 'eng_grammar-basic_block5_verb_forms.json'
    };

    const CATEGORIES = {
      all: [
        { key: 'all', label: '★ 全120問一括ランダム演習' }
      ],
      cat_pos: [
        { key: 'block1_pos', label: '基礎1: 日本語でわかる品詞識別特訓 (25問)' }
      ],
      cat_sv: [
        { key: 'block2_sv', label: '基礎2: 主語・動詞の発見と基本時制 (25問)' }
      ],
      cat_pronoun: [
        { key: 'block3_pronoun', label: '基礎3: 代名詞の格変化マスター (20問)' }
      ],
      cat_prep_conj: [
        { key: 'block4_prep', label: '基礎4: 基本前置詞と等位接続詞 (25問)' }
      ],
      cat_verb: [
        { key: 'block5_verb', label: '基礎5: 助動詞・不定詞・動名詞 (25問)' }
      ]
    };

    let allData = [];
    let activeDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let filterMode = 'all';

    const fontSizes = [
      { q: 'text-base sm:text-lg', opt: 'text-xs' },
      { q: 'text-lg sm:text-xl', opt: 'text-xs sm:text-sm' },
      { q: 'text-xl sm:text-2xl', opt: 'text-sm sm:text-base' }
    ];
    let currentFontIndex = parseInt(localStorage.getItem('grammar_basic_font_level') || '1', 10);
    let stats = JSON.parse(localStorage.getItem('eng_grammar_basic_stats') || '{"mastered":{}, "review":{}}');

    const categorySelect = document.getElementById('categorySelect');
    const chapterSelect = document.getElementById('chapterSelect');
    const flashCard = document.getElementById('flashCard');
    const cardCategoryBadge = document.getElementById('cardCategoryBadge');
    const cardStatusBadge = document.getElementById('cardStatusBadge');
    const cardTopicTitle = document.getElementById('cardTopicTitle');
    const cardExampleEn = document.getElementById('cardExampleEn');
    const cardExampleJa = document.getElementById('cardExampleJa');
    const cardQuestion = document.getElementById('cardQuestion');
    const cardOptions = document.getElementById('cardOptions');
    const cardAnswer = document.getElementById('cardAnswer');
    const cardRule = document.getElementById('cardRule');
    const cardFullSentence = document.getElementById('cardFullSentence');
    const cardFullSentenceJa = document.getElementById('cardFullSentenceJa');
    const progressIndex = document.getElementById('progressIndex');
    const unmasteredBadge = document.getElementById('unmasteredBadge');
    const listModal = document.getElementById('listModal');

    async function initApp() {
      applyFontClasses();
      onCategoryChange('all');
    }

    function onCategoryChange(catKey) {
      const items = CATEGORIES[catKey] || [];
      chapterSelect.innerHTML = items.map(item => `<option value="${item.key}">${item.label}</option>`).join('');
      if (items.length > 0) {
        changeChapter(items[0].key);
      }
    }

    async function changeChapter(key) {
      const cacheBuster = '?t=' + new Date().getTime();
      allData = [];

      try {
        if (key === 'all') {
          const promises = Object.values(GRAMMAR_FILES).map(file => 
            fetch(file + cacheBuster).then(r => r.ok ? r.json() : [])
          );
          const results = await Promise.all(promises);
          allData = results.flat();
        } else {
          const file = GRAMMAR_FILES[key];
          const res = await fetch(file + cacheBuster);
          if (!res.ok) throw new Error('File load error');
          allData = await res.json();
        }
      } catch (err) {
        console.error('JSON読み込み失敗:', err);
        allData = [];
      }

      rebuildDeck();
    }

    function changeDeckSize(val) {
      rebuildDeck();
    }

    function setFilterMode(mode) {
      filterMode = mode;
      const btnAll = document.getElementById('btnFilterAll');
      const btnRev = document.getElementById('btnFilterReview');

      if (mode === 'all') {
        btnAll.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-cyan-600 text-white transition';
        btnRev.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-900 border border-slate-800 text-slate-400 hover:text-rose-400 transition flex items-center gap-1';
      } else {
        btnRev.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-600 text-white transition flex items-center gap-1';
        btnAll.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-slate-900 border border-slate-800 text-slate-400 hover:text-cyan-400 transition';
      }
      rebuildDeck();
    }

    function rebuildDeck() {
      let pool = [...allData];

      if (filterMode === 'review') {
        pool = pool.filter(d => stats.review[d.id]);
      }

      const sizeVal = document.getElementById('deckSizeSelect').value;
      if (sizeVal !== 'all') {
        const limit = parseInt(sizeVal, 10);
        pool = pool.sort(() => Math.random() - 0.5).slice(0, limit);
      }

      activeDeck = pool;
      currentIndex = 0;
      updateUnmasteredCount();
      loadCard(0);
    }

    function updateUnmasteredCount() {
      const reviewCount = Object.keys(stats.review).length;
      unmasteredBadge.textContent = reviewCount;
    }

    function loadCard(index) {
      if (!activeDeck || activeDeck.length === 0) {
        progressIndex.textContent = "0 / 0";
        cardCategoryBadge.textContent = "なし";
        cardTopicTitle.textContent = "対象の論点はありません";
        cardExampleEn.textContent = "問題データが見つからないか、すべて習得済みです。";
        cardExampleJa.textContent = "";
        cardQuestion.textContent = "上のジャンルや論点集から別の出題を選択してください。";
        cardOptions.textContent = "[ - ]";
        cardAnswer.textContent = "-";
        cardRule.textContent = "-";
        cardFullSentence.textContent = "-";
        cardFullSentenceJa.textContent = "-";
        cardStatusBadge.classList.add('hidden');
        return;
      }

      isFlipped = false;
      flashCard.classList.remove('rotate-y-180');

      const item = activeDeck[index];
      cardCategoryBadge.textContent = item.block || item.category || "基礎論点";
      cardTopicTitle.textContent = item.topic;
      cardExampleEn.textContent = item.example_en ? `"${item.example_en}"` : "";
      cardExampleJa.textContent = item.example_ja || "";
      cardQuestion.textContent = item.question;
      cardOptions.textContent = item.options;
      cardAnswer.textContent = item.answer;
      cardRule.textContent = item.rule;
      
      const full = item.question ? item.question.replace('______', item.answer) : "";
      cardFullSentence.textContent = full ? `"${full}"` : "-";
      // 裏面の完成文の日本語訳を表示（question_jaがあればそれを優先、なければexample_ja）
      cardFullSentenceJa.textContent = item.question_ja || item.example_ja || "-";

      if (stats.review[item.id]) {
        cardStatusBadge.classList.remove('hidden');
      } else {
        cardStatusBadge.classList.add('hidden');
      }

      progressIndex.textContent = `${index + 1} / ${activeDeck.length}`;
    }

    function flipCard() {
      if (activeDeck.length === 0) return;
      isFlipped = !isFlipped;
      flashCard.classList.toggle('rotate-y-180', isFlipped);
    }

    function prevCard() {
      if (activeDeck.length === 0) return;
      if (currentIndex > 0) {
        currentIndex--;
        loadCard(currentIndex);
      }
    }

    function nextCard() {
      if (activeDeck.length === 0) return;
      if (currentIndex < activeDeck.length - 1) {
        currentIndex++;
        loadCard(currentIndex);
      } else {
        currentIndex = 0;
        loadCard(0);
      }
    }

    function handleGrade(isMastered) {
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      const id = currentItem.id;

      if (isMastered) {
        stats.mastered[id] = true;
        delete stats.review[id];
      } else {
        stats.review[id] = true;
        delete stats.mastered[id];
      }

      localStorage.setItem('eng_grammar_basic_stats', JSON.stringify(stats));
      updateUnmasteredCount();

      if (currentIndex < activeDeck.length - 1) {
        currentIndex++;
        loadCard(currentIndex);
      } else {
        loadCard(currentIndex);
      }
    }

    function adjustFontSize(delta) {
      const nextIndex = currentFontIndex + delta;
      if (nextIndex >= 0 && nextIndex < fontSizes.length) {
        currentFontIndex = nextIndex;
        localStorage.setItem('grammar_basic_font_level', currentFontIndex);
        applyFontClasses();
      }
    }

    function applyFontClasses() {
      const allQ = fontSizes.map(f => f.q.split(' ')).flat();
      cardQuestion.classList.remove(...allQ);
      cardQuestion.classList.add(...fontSizes[currentFontIndex].q.split(' '));
    }

    function playSpeech(e) {
      if (e) e.stopPropagation();
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      const textToRead = currentItem.example_en || currentItem.question.replace('______', currentItem.answer);
      const uttr = new SpeechSynthesisUtterance(textToRead);
      uttr.lang = 'en-US';
      uttr.rate = 0.85;
      window.speechSynthesis.speak(uttr);
    }

    function openListModal() {
      renderList(allData);
      listModal.classList.remove('hidden');
      document.getElementById('listSearchInput').value = '';
    }

    function closeListModal() {
      listModal.classList.add('hidden');
    }

    function filterList() {
      const q = document.getElementById('listSearchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        (item.topic && item.topic.toLowerCase().includes(q)) ||
        (item.question && item.question.toLowerCase().includes(q)) ||
        (item.answer && item.answer.toLowerCase().includes(q)) ||
        (item.rule && item.rule.toLowerCase().includes(q))
      );
      renderList(filtered);
    }

    function renderList(items) {
      const container = document.getElementById('listContainer');
      document.getElementById('modalListCount').textContent = `(${items.length} 件)`;
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">該当する論点は見つかりませんでした</p>';
        return;
      }

      items.forEach(item => {
        const isMastered = stats.mastered[item.id];
        const isReview = stats.review[item.id];
        const row = document.createElement('div');
        row.className = 'p-3 rounded-xl bg-slate-900/80 border border-slate-800 space-y-1.5 hover:border-slate-700 transition';
        row.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] font-mono text-cyan-400 font-bold px-2 py-0.5 rounded bg-cyan-950/80 border border-cyan-800">
              ${item.block || 'Basic'}
            </span>
            <div class="flex items-center gap-1.5">
              ${isMastered ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold">習得済</span>' : ''}
              ${isReview ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-rose-950 text-rose-400 border border-rose-800 font-bold">要復習</span>' : ''}
            </div>
          </div>
          <div class="text-xs font-bold text-amber-300">${item.topic}</div>
          <div class="text-[11px] text-slate-400 bg-slate-950/50 p-2 rounded-lg">
            <span class="text-slate-300 font-semibold">${item.example_en || ''}</span><br>
            <span class="text-slate-500">${item.example_ja || ''}</span>
          </div>
          <div class="text-xs font-bold text-white pt-0.5">${item.question}</div>
          <div class="text-xs font-mono font-bold text-emerald-300">正解: ${item.answer}</div>
          <div class="text-[11px] text-slate-400 bg-slate-950/70 p-2 rounded-lg border border-slate-900">
            <strong class="text-amber-400">解法:</strong> ${item.rule}
          </div>
        `;
        container.appendChild(row);
      });
    }

    // キーボードショートカット
    document.addEventListener('keydown', (e) => {
      if (listModal.classList.contains('hidden')) {
        if (e.code === 'Space') { e.preventDefault(); flipCard(); }
        else if (e.code === 'ArrowUp') { e.preventDefault(); handleGrade(true); }
        else if (e.code === 'ArrowDown') { e.preventDefault(); handleGrade(false); }
        else if (e.code === 'ArrowLeft') { e.preventDefault(); prevCard(); }
        else if (e.code === 'ArrowRight') { e.preventDefault(); nextCard(); }
      }
    });

    initApp();
  </script>
</body>
</html>
