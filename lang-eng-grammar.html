        { key: 'block4_1', label: 'Block 4-1: 等位・相関接続詞 (50問)' },
        { key: 'block4_2', label: 'Block 4-2: 接続詞 vs 前置詞 (50問)' },
        { key: 'block4_3', label: 'Block 4-3: 関係代名詞 (50問)' },
        { key: 'block4_4', label: 'Block 4-4: 関係副詞・複合関係詞 (50問)' },
        { key: 'block4_5', label: 'Block 4-5: 名詞節を導く接続詞 (50問)' }
      ],
      cat5: [
        { key: 'block5_1', label: 'Block 5-1: 比較表現 (50問)' },
        { key: 'block5_2', label: 'Block 5-2: 倒置 (50問)' },
        { key: 'block5_3', label: 'Block 5-3: 強調・否定 (50問)' }
      ],
      cat6: [
        { key: 'block6_1', label: 'Block 6-1: 動詞の型 (50問)' },
        { key: 'block6_2', label: 'Block 6-2: 前置詞句・群前置詞 (50問)' },
        { key: 'block6_3', label: 'Block 6-3: 頻出接続副詞 (50問)' }
      ]
    };

    let allData = [];
    let activeDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let filterMode = 'all';

    const fontSizes = [
      'text-base sm:text-lg',
      'text-lg sm:text-xl',
      'text-xl sm:text-2xl'
    ];
    let currentFontIndex = parseInt(localStorage.getItem('grammar_font_level') || '1', 10);
    let stats = JSON.parse(localStorage.getItem('eng_grammar_stats') || '{"mastered":{}, "review":{}}');

    const chapterSelect = document.getElementById('chapterSelect');
    const flashCard = document.getElementById('flashCard');
    const cardCategoryBadge = document.getElementById('cardCategoryBadge');
    const cardStatusBadge = document.getElementById('cardStatusBadge');
    const cardTopicTitle = document.getElementById('cardTopicTitle');
    const cardExampleEn = document.getElementById('cardExampleEn');
    const cardExampleJa = document.getElementById('cardExampleJa');
    const cardQuestion = document.getElementById('cardQuestion');
    const cardOptions = document.getElementById('cardOptions');
    const cardAnswer = document.getElementById('cardAnswer');
    const cardRule = document.getElementById('cardRule');
    const cardFullSentence = document.getElementById('cardFullSentence');
    const progressIndex = document.getElementById('progressIndex');
    const progressBarFill = document.getElementById('progressBarFill');
    const currentChapterLabel = document.getElementById('currentChapterLabel');
    const unmasteredBadge = document.getElementById('unmasteredBadge');
    const frontActionBar = document.getElementById('frontActionBar');
    const backActionBar = document.getElementById('backActionBar');
    const listModal = document.getElementById('listModal');

    function toggleSettingsDrawer() {
      document.getElementById('settingsDrawer').classList.toggle('hidden');
    }

    async function initApp() {
      applyFontClasses();
      onCategoryChange('cat1', false);
    }

    function onCategoryChange(catKey, autoClose = false) {
      const items = CATEGORIES[catKey] || [];
      chapterSelect.innerHTML = items.map(item => `<option value="${item.key}">${item.label}</option>`).join('');
      if (items.length > 0) {
        changeChapter(items[0].key, autoClose);
      }
    }

    async function changeChapter(key, autoClose = false) {
      const cacheBuster = '?t=' + new Date().getTime();
      allData = [];

      const selectedOpt = chapterSelect.options[chapterSelect.selectedIndex];
      if (selectedOpt && currentChapterLabel) {
        currentChapterLabel.textContent = selectedOpt.text.replace(/\s*\(\d+問\)/, '').replace('★ ', '');
      }

      try {
        if (key === 'all') {
          const promises = Object.values(GRAMMAR_FILES).map(file => 
            fetch(file + cacheBuster).then(r => r.ok ? r.json() : [])
          );
          const results = await Promise.all(promises);
          allData = results.flat();
        } else {
          const file = GRAMMAR_FILES[key];
          const res = await fetch(file + cacheBuster);
          if (!res.ok) throw new Error('File load error');
          allData = await res.json();
        }
      } catch (err) {
        console.error('JSON読み込み失敗:', err);
        allData = [];
      }

      rebuildDeck();
      if (autoClose) toggleSettingsDrawer();
    }

    function changeDeckSize() {
      rebuildDeck();
    }

    function setFilterMode(mode) {
      filterMode = mode;
      const btnAll = document.getElementById('btnFilterAll');
      const btnRev = document.getElementById('btnFilterReview');

      if (mode === 'all') {
        btnAll.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#102542] text-white transition';
        btnRev.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold text-slate-500 hover:text-[#CD2D2D] transition';
      } else {
        btnRev.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#CD2D2D] text-white transition';
        btnAll.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold text-slate-500 hover:text-[#102542] transition';
      }
      rebuildDeck();
    }

    function rebuildDeck() {
      let pool = [...allData];

      if (filterMode === 'review') {
        pool = pool.filter(d => stats.review[d.id]);
      }

      const sizeVal = document.getElementById('deckSizeSelect').value;
      if (sizeVal !== 'all') {
        const limit = parseInt(sizeVal, 10);
        pool = pool.sort(() => Math.random() - 0.5).slice(0, limit);
      }

      activeDeck = pool;
      currentIndex = 0;
      updateUnmasteredCount();
      loadCard(0);
    }

    function updateUnmasteredCount() {
      const reviewCount = Object.keys(stats.review).length;
      unmasteredBadge.textContent = reviewCount;
    }

    function syncActionBars() {
      if (isFlipped) {
        frontActionBar.classList.add('hidden');
        backActionBar.classList.remove('hidden');
      } else {
        frontActionBar.classList.remove('hidden');
        backActionBar.classList.add('hidden');
      }
    }

    function loadCard(index) {
      isFlipped = false;
      flashCard.classList.remove('rotate-y-180');
      syncActionBars();

      if (!activeDeck || activeDeck.length === 0) {
        progressIndex.textContent = "0 / 0";
        progressBarFill.style.width = "0%";
        cardCategoryBadge.textContent = "完了";
        cardTopicTitle.textContent = "対象の論点はありません";
        cardExampleEn.textContent = "-";
        cardExampleJa.textContent = "";
        cardQuestion.textContent = "すべて習得済みか、問題データが見つかりません。";
        cardOptions.textContent = "[ 設定から別のジャンルを選択してください ]";
        cardAnswer.textContent = "-";
        cardRule.textContent = "-";
        cardFullSentence.textContent = "-";
        cardStatusBadge.classList.add('hidden');
        return;
      }

      const item = activeDeck[index];
      cardCategoryBadge.textContent = item.block || item.category || "文法論点";
      cardTopicTitle.textContent = item.topic || "コア論点";
      cardExampleEn.textContent = item.example_en ? `"${item.example_en}"` : "";
      cardExampleJa.textContent = item.example_ja || "";
      cardQuestion.textContent = item.question;
      cardOptions.textContent = item.options;
      cardAnswer.textContent = item.answer;
      cardRule.textContent = item.rule;
      cardFullSentence.textContent = item.question ? `"${item.question.replace('______', item.answer)}"` : "";

      if (stats.review[item.id]) {
        cardStatusBadge.classList.remove('hidden');
      } else {
        cardStatusBadge.classList.add('hidden');
      }

      progressIndex.textContent = `${index + 1} / ${activeDeck.length}`;
      const percent = Math.round(((index + 1) / activeDeck.length) * 100);
      progressBarFill.style.width = `${percent}%`;
    }

    function flipCard() {
      if (activeDeck.length === 0) return;
      isFlipped = !isFlipped;
      flashCard.classList.toggle('rotate-y-180', isFlipped);
      syncActionBars();
    }

    function prevCard() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex > 0) ? currentIndex - 1 : activeDeck.length - 1;
      loadCard(currentIndex);
    }

    function nextCard() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex < activeDeck.length - 1) ? currentIndex + 1 : 0;
      loadCard(currentIndex);
    }

    function handleGrade(isMastered) {
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      const id = currentItem.id;

      if (isMastered) {
        stats.mastered[id] = true;
        delete stats.review[id];
      } else {
        stats.review[id] = true;
        delete stats.mastered[id];
      }

      localStorage.setItem('eng_grammar_stats', JSON.stringify(stats));
      updateUnmasteredCount();

      if (filterMode === 'review' && isMastered) {
        rebuildDeck();
      } else {
        nextCard();
      }
    }

    function adjustFontSize(delta) {
      const nextIndex = currentFontIndex + delta;
      if (nextIndex >= 0 && nextIndex < fontSizes.length) {
        currentFontIndex = nextIndex;
        localStorage.setItem('grammar_font_level', currentFontIndex);
        applyFontClasses();
      }
    }

    function applyFontClasses() {
      const allQ = fontSizes.map(f => f.split(' ')).flat();
      cardQuestion.classList.remove(...allQ);
      cardQuestion.classList.add(...fontSizes[currentFontIndex].split(' '));
    }

    function playSpeech(e) {
      if (e) e.stopPropagation();
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      const textToRead = currentItem.question.replace('______', currentItem.answer);
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(textToRead);
      uttr.lang = 'en-US';
      uttr.rate = 0.88;
      window.speechSynthesis.speak(uttr);
    }

    // スマホ左右スワイプ操作
    let touchStartX = 0;
    let touchStartY = 0;
    const cardTouchArea = document.getElementById('cardTouchArea');
    cardTouchArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardTouchArea.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
        e.stopPropagation();
        if (diffX < 0) nextCard();
        else prevCard();
      }
    }, { passive: true });

    function openListModal() {
      renderList(allData);
      listModal.classList.remove('hidden');
      document.getElementById('listSearchInput').value = '';
    }

    function closeListModal() {
      listModal.classList.add('hidden');
    }

    function filterList() {
      const q = document.getElementById('listSearchInput').value.toLowerCase();
      const filtered = allData.filter(item => 
        (item.topic && item.topic.toLowerCase().includes(q)) ||
        (item.question && item.question.toLowerCase().includes(q)) ||
        (item.answer && item.answer.toLowerCase().includes(q)) ||
        (item.rule && item.rule.toLowerCase().includes(q))
      );
      renderList(filtered);
    }

    function renderList(items) {
      const container = document.getElementById('listContainer');
      document.getElementById('modalListCount').textContent = `(${items.length} 件)`;
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">該当する論点は見つかりませんでした</p>';
        return;
      }

      items.forEach(item => {
        const isMastered = stats.mastered[item.id];
        const isReview = stats.review[item.id];
        const row = document.createElement('div');
        row.className = 'p-3 rounded-xl bg-[#F4F7FB] border border-[#DCE4EE] space-y-1.5 hover:border-[#102542] transition cursor-pointer';
        row.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] font-mono text-[#102542] font-bold px-2 py-0.5 rounded bg-white border border-[#DCE4EE]">
              ${item.block || 'Grammar'}
            </span>
            <div class="flex items-center gap-1.5">
              ${isMastered ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold">済</span>' : ''}
              ${isReview ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-red-50 text-[#CD2D2D] border border-red-200 font-bold">未習得</span>' : ''}
            </div>
          </div>
          <div class="text-xs font-bold text-[#CD2D2D]">${item.topic}</div>
          <div class="text-xs font-bold text-[#102542] pt-0.5">${item.question}</div>
          <div class="text-xs font-mono font-bold text-emerald-700">正解: ${item.answer}</div>
          <div class="text-[11px] text-slate-600 bg-white p-2 rounded-lg border border-[#DCE4EE]">
            <strong class="text-[#CD2D2D]">論点:</strong> ${item.rule}
          </div>
        `;
        row.addEventListener('click', () => {
          filterMode = 'all';
          document.getElementById('deckSizeSelect').value = 'all';
          rebuildDeck();
          const matchIndex = activeDeck.findIndex(it => it.id === item.id);
          if (matchIndex !== -1) {
            currentIndex = matchIndex;
            loadCard(currentIndex);
          }
          closeListModal();
        });
        container.appendChild(row);
      });
    }

    document.addEventListener('keydown', (e) => {
      if (listModal.classList.contains('hidden')) {
        if (e.code === 'Space') { e.preventDefault(); flipCard(); }
        else if (e.code === 'ArrowUp') { e.preventDefault(); handleGrade(true); }
        else if (e.code === 'ArrowDown') { e.preventDefault(); handleGrade(false); }
        else if (e.code === 'ArrowLeft') { e.preventDefault(); prevCard(); }
        else if (e.code === 'ArrowRight') { e.preventDefault(); nextCard(); }
      }
    });

    initApp();
  </script>
