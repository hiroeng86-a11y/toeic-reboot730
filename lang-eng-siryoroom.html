<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOEIC 文法・品詞判定 資料室 | TOEIC RE:BOOT 730</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #F4F7FB;
      color: #102542;
    }
    .font-chakra { font-family: 'Chakra Petch', sans-serif; }
    .kobe-navy { color: #102542; }
    .kobe-red { color: #CD2D2D; }

    .kobe-card-glow {
      border: 1px solid #DCE4EE;
      box-shadow: 0 4px 6px -1px rgba(16, 37, 66, 0.05);
      transition: all 0.25s ease;
    }
    .kobe-card-glow:hover {
      border-color: rgba(205, 45, 45, 0.5);
      box-shadow: 0 10px 25px -3px rgba(16, 37, 66, 0.12), 0 0 18px rgba(205, 45, 45, 0.12);
      transform: translateY(-2px);
    }
    .kobe-btn-glow {
      transition: all 0.2s ease;
    }
    .kobe-btn-glow:hover {
      border-color: #CD2D2D;
      box-shadow: 0 0 14px rgba(205, 45, 45, 0.25);
    }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
    details[open] .chevron-icon { transform: rotate(90deg); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- ヘッダー -->
  <header class="border-b border-[#DCE4EE] bg-white/95 backdrop-blur sticky top-0 z-40">
    <div class="h-[3px] bg-[#CD2D2D] w-full"></div>
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <span class="w-3 h-3 rounded-full bg-[#CD2D2D] shadow-[0_0_10px_rgba(205,45,45,0.4)] animate-pulse"></span>
        <a href="index.html" class="font-chakra text-xl font-bold tracking-wider text-[#102542] hover:opacity-90 transition">
          TOEIC RE:BOOT <span class="kobe-red">730</span>
        </a>
      </div>
      <nav class="flex items-center gap-4 text-xs sm:text-sm font-semibold text-slate-600">
        <a href="index.html" class="hover:text-[#CD2D2D] transition-colors flex items-center gap-1">
          <i class="fa-solid fa-house text-xs"></i> トップへ戻る
        </a>
      </nav>
    </div>
  </header>

  <!-- タイトルエリア -->
  <section class="border-b border-[#DCE4EE] py-7 md:py-9 bg-gradient-to-b from-white via-white to-[#F4F7FB]">
    <div class="max-w-4xl mx-auto px-4 text-center space-y-2">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-red-50 text-[#CD2D2D] border border-red-200">
        <i class="fa-solid fa-folder-open"></i> SPECIAL CORNER ｜ 得点力直結・知識庫
      </div>
      <h1 class="text-2xl md:text-3xl font-extrabold text-[#102542]">
        TOEIC 文法・品詞判定 <span class="kobe-red">資料室</span>
      </h1>
      <p class="text-xs md:text-sm text-slate-600 max-w-xl mx-auto">
        Part 5 を「感覚」ではなく「ロジック」で瞬殺するための論点別解説まとめ集です。
      </p>
    </div>
  </section>

  <!-- メインコンテンツ -->
  <main class="max-w-4xl mx-auto px-4 py-7 space-y-6 flex-1 w-full">

    <!-- カテゴリフィルターボタン -->
    <div id="category-tabs" class="flex flex-wrap items-center gap-2"></div>

    <!-- 資料カード一覧（JSONから自動生成） -->
    <div id="siryo-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

    <!-- トップへ戻る導線 -->
    <div class="pt-4 text-center">
      <a href="index.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-white hover:bg-[#F4F7FB] border border-[#102542] text-[#102542] font-bold text-xs sm:text-sm transition kobe-btn-glow">
        <i class="fa-solid fa-arrow-left text-[#CD2D2D]"></i>
        <span>自習システム トップへ戻る</span>
      </a>
    </div>

  </main>

  <!-- フッター -->
  <footer class="border-t border-[#DCE4EE] bg-white py-6 text-center text-xs text-slate-500 space-y-1.5">
    <p class="font-semibold text-[#102542]">© 2026 TOEIC RE:BOOT 730<a href="ura_index.html" class="text-slate-400 hover:text-slate-600">.</a></p>
    <p>50代からのスコア奪還 自習システム</p>
    <p class="text-[11px] text-slate-400">
      Amazonのアソシエイトとして、当サイトは適格販売により収入を得ています。
      <span class="mx-1.5 text-slate-300">|</span>
      <a href="contact.html" class="hover:text-[#CD2D2D] transition-colors">不具合・誤字報告</a>
    </p>
  </footer>

  <!-- JSON読み込み＆描画スクリプト -->
  <script>
    let allItems = [];
    let currentCategory = 'すべて';

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('siryo-grid');
      try {
        const res = await fetch('./siryoroom.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error('JSON読み込み失敗');
        allItems = await res.json();

        renderTabs();
        renderCards();
      } catch (err) {
        grid.innerHTML = `<p class="col-span-full text-center text-sm text-red-600 p-4 bg-white rounded-xl border border-red-200">資料データの読み込みに失敗しました。</p>`;
      }
    });

    function renderTabs() {
      const tabsContainer = document.getElementById('category-tabs');
      const categories = ['すべて', ...new Set(allItems.map(item => item.category))];

      tabsContainer.innerHTML = categories.map(cat => {
        const isActive = cat === currentCategory;
        const activeClass = isActive
          ? 'bg-[#102542] text-white border-[#102542] shadow-sm'
          : 'bg-white text-slate-600 border-[#DCE4EE] hover:border-[#CD2D2D] hover:text-[#102542]';
        return `
          <button onclick="selectCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${activeClass}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    function selectCategory(cat) {
      currentCategory = cat;
      renderTabs();
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('siryo-grid');
      const filtered = currentCategory === 'すべて'
        ? allItems
        : allItems.filter(item => item.category === currentCategory);

      grid.innerHTML = filtered.map(item => {
        const noteHtml = item.note ? `
          <details class="mt-3 pt-2.5 border-t border-[#DCE4EE]/80 text-xs text-slate-600">
            <summary class="cursor-pointer font-semibold text-[#102542] hover:text-[#CD2D2D] inline-flex items-center gap-1.5 select-none">
              <i class="fa-solid fa-chevron-right text-[10px] text-[#CD2D2D] chevron-icon transition-transform duration-200"></i>
              <span>重要ポイントを見る</span>
            </summary>
            <div class="mt-2 p-2.5 rounded-lg bg-[#F4F7FB] text-slate-700 leading-relaxed">
              ${item.note}
            </div>
          </details>
        ` : '';

        return `
          <article class="bg-white rounded-2xl p-5 flex flex-col justify-between kobe-card-glow">
            <div>
              <div class="flex items-center justify-between gap-2 mb-2.5">
                <span class="text-xs font-bold text-[#CD2D2D] flex items-center gap-1.5">
                  <i class="fa-solid fa-file-lines"></i> ${item.category}
                </span>
                <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-[#F4F7FB] text-[#102542] border border-[#DCE4EE] font-semibold">
                  ${item.badge}
                </span>
              </div>

              <h2 class="text-base sm:text-lg font-bold text-[#102542] leading-snug mb-1.5">${item.title}</h2>
              <p class="text-xs text-slate-600 leading-relaxed">${item.summary}</p>
            </div>

            <div class="mt-4">
              <a href="${item.url}" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-[#102542] hover:bg-[#1a3860] border border-[#102542] hover:border-[#CD2D2D] text-white font-bold text-xs transition kobe-btn-glow group">
                <span>解説ページを開く</span>
                <i class="fa-solid fa-arrow-right text-[11px] text-red-400 group-hover:translate-x-1 transition-transform"></i>
              </a>
              ${noteHtml}
            </div>
          </article>
        `;
      }).join('');
    }
  </script>

  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "bbb557a7347f45f2a4758e1eb4e53301"}'></script>
</body>
</html>
