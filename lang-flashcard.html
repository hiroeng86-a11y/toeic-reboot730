<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcard Lab | TOEIC RE:BOOT 730</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #050811;
    }
    .font-chakra { font-family: 'Chakra Petch', sans-serif; }
    .perspective { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    .neon-text-green {
      color: #22c55e;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.45);
    }
    .neon-border-green {
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
    }
    .neon-border-green:hover {
      border-color: rgba(74, 222, 128, 0.7);
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col antialiased selection:bg-green-500 selection:text-black">

  <!-- ヘッダー -->
  <header class="border-b border-slate-800/80 bg-[#050811]/90 backdrop-blur sticky top-0 z-40">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-green-400 transition">
        <i class="fa-solid fa-arrow-left"></i>
        <span>ポータルへ戻る</span>
      </a>
      <div class="flex items-center gap-3">
        <!-- 一覧モーダルボタン -->
        <button id="btnOpenList" class="text-xs px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-700 hover:border-green-400 text-slate-300 hover:text-green-400 transition flex items-center gap-1.5">
          <i class="fa-solid fa-list-ul"></i> 一覧表示
        </button>
        <span class="font-chakra text-sm font-bold neon-text-green">
          FLASHCARD <span class="text-white">LAB</span>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 flex-1 w-full space-y-4">

    <!-- コントロールバー -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <!-- 教材選択 -->
        <div class="flex items-center gap-2 text-xs text-slate-300 w-full sm:w-auto">
          <span class="text-slate-400"><i class="fa-solid fa-book text-green-400 mr-1"></i>教材:</span>
          <select id="dictSelect" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-green-400 flex-1 sm:w-60">
            <option value="ALL">★ すべての辞書を結合 (全データ)</option>
            <option value="words.json">一般ビジネス・頻出コロケーション</option>
            <option value="words-run.json">基本動詞: run</option>
            <option value="words-take.json">基本動詞: take</option>
            <option value="words-get.json">基本動詞: get</option>
            <option value="words-make.json">基本動詞: make</option>
            <option value="words-have.json">基本動詞: have</option>
            <option value="words-hold.json">基本動詞: hold</option>
            <option value="words-give.json">基本動詞: give</option>
            <option value="words-verbs.json">重要動詞まとめ (混合版)</option>
          </select>
        </div>

        <!-- オートタイマー設定（3秒 / 10秒 / 15秒 / OFF） -->
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <i class="fa-regular fa-clock text-green-400"></i>
          <span>めくり後次問:</span>
          <select id="timerSelect" class="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-white focus:outline-none focus:border-green-400 font-medium">
            <option value="0">OFF</option>
            <option value="3">3秒（即断）</option>
            <option value="10" selected>10秒（標準）</option>
            <option value="15">15秒（音読）</option>
          </select>
        </div>
      </div>

      <!-- 進捗 & カウンター -->
      <div class="flex items-center justify-between text-xs pt-1 border-t border-slate-800/80">
        <div class="flex items-center gap-3">
          <span id="currentDatasetTitle" class="text-slate-400 truncate max-w-[180px]">読み込み中...</span>
          <label class="flex items-center gap-1.5 text-slate-400 cursor-pointer">
            <input type="checkbox" id="onlyReviewCheck" class="rounded accent-green-500">
            <span class="text-[11px]">未習得のみ</span>
          </label>
        </div>
        <div class="font-chakra text-slate-300 font-bold">
          <span id="currentIndex" class="text-green-400">0</span> / <span id="totalCount">0</span>
        </div>
      </div>

      <!-- プログレスバー -->
      <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-200"></div>
      </div>
    </div>

    <!-- カード領域 -->
    <div class="perspective w-full h-[320px] cursor-pointer" id="cardContainer">
      <div id="cardInner" class="transform-style-3d transition-transform duration-300 relative w-full h-full">

        <!-- 表面（問題） -->
        <div class="backface-hidden absolute inset-0 bg-slate-900/80 border border-slate-800 hover:border-green-400/50 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
          <div class="flex items-center justify-between text-xs">
            <span id="cardCategory" class="px-2.5 py-0.5 rounded bg-green-500/10 text-green-400 border border-green-500/30 font-bold uppercase tracking-wider font-chakra">
              PHRASE
            </span>
            <span class="text-slate-500 text-[11px]"><i class="fa-solid fa-repeat mr-1"></i>タップで意味を表示</span>
          </div>

          <div class="text-center my-auto px-2">
            <h2 id="cardWord" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide leading-tight">
              Loading...
            </h2>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-500">
            <button id="btnSpeak" class="p-2 hover:text-green-400 transition" title="音声再生">
              <i class="fa-solid fa-volume-high text-sm"></i>
            </button>
            <span class="text-[11px]">Space / Tap で裏返す</span>
          </div>
        </div>

        <!-- 裏面（解答） -->
        <div class="backface-hidden rotate-y-180 absolute inset-0 bg-slate-900/90 border border-green-500/60 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
          <div class="flex items-center justify-between text-xs">
            <span class="px-2.5 py-0.5 rounded bg-slate-800 text-green-300 font-bold font-chakra">ANSWER</span>
            <span class="text-slate-500 text-[11px]"><i class="fa-solid fa-repeat mr-1"></i>タップで表面へ</span>
          </div>

          <div class="space-y-4 my-auto">
            <div>
              <div class="text-xs text-green-400 font-bold">日本語訳</div>
              <p id="cardMeaning" class="text-lg sm:text-xl font-bold text-white mt-1">--</p>
            </div>
            <div id="exampleBox" class="bg-slate-950/70 p-3 rounded-lg border border-slate-800 text-xs space-y-1">
              <div class="text-slate-400 font-medium">例文</div>
              <p id="cardExampleEn" class="text-slate-200 font-semibold">--</p>
              <p id="cardExampleJa" class="text-slate-400">--</p>
            </div>
          </div>

          <!-- オートタイマー進行表示 -->
          <div class="text-center text-[11px] text-slate-400" id="timerStatusText">
            タップで表面に戻ります
          </div>
        </div>

      </div>
    </div>

    <!-- 習得ステータス選択（未習得 / 習得済み 独立ボタン形式） -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-2.5 flex items-center gap-2">
      <span class="text-[11px] text-slate-400 font-bold pl-1 hidden sm:inline">定着度:</span>

      <!-- 未習得ボタン -->
      <button id="btnMarkUnlearned" class="flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-slate-800 bg-slate-950 text-slate-400 hover:text-amber-300">
        <i class="fa-solid fa-rotate-left text-xs"></i>
        <span>要復習（未習得）</span>
      </button>

      <!-- 習得済みボタン -->
      <button id="btnMarkMastered" class="flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-slate-800 bg-slate-950 text-slate-400 hover:text-green-300">
        <i class="fa-solid fa-circle-check text-xs"></i>
        <span>覚えた（習得済）</span>
      </button>
    </div>

    <!-- ナビゲーション（前へ / 次へ） -->
    <div class="flex items-center justify-between gap-3 pt-1">
      <button id="btnPrev" class="w-1/3 py-3 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 font-bold text-xs transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-chevron-left"></i> 前へ
      </button>

      <button id="btnNext" class="w-2/3 py-3 rounded-xl bg-green-500 hover:bg-green-400 text-slate-950 font-bold text-xs transition flex items-center justify-center gap-1.5 shadow-[0_0_15px_rgba(34,197,94,0.3)]">
        次へ進む <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <p class="text-center text-[11px] text-slate-500">
      キー操作：[Space] めくる ｜ [←][→] 前後移動 ｜ [1] 要復習 ｜ [2] 習得済
    </p>

  </main>

  <!-- 一覧表示モーダル -->
  <div id="listModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl max-h-[80vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-green-400"></i> 単語リスト一覧
        </h3>
        <button id="btnCloseList" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-base"></i>
        </button>
      </div>
      <div class="p-3 overflow-y-auto flex-1 divide-y divide-slate-800/60 text-xs" id="wordListTable">
        <!-- JSで動的生成 -->
      </div>
      <div class="p-3 border-t border-slate-800 text-right">
        <button id="btnCloseListFooter" class="px-4 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // --- 状態管理 ---
    let currentWords = [];
    let filteredIndices = [];
    let currentPos = 0;
    let isFlipped = false;
    let autoTimer = null;
    let countdownInterval = null;

    // 習得済み保存ストレージ (localStorage)
    const STORAGE_KEY = "toeic_mastered_words_v1";
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...masteredSet]));
    }

    // --- DOM要素 ---
    const dictSelect = document.getElementById("dictSelect");
    const timerSelect = document.getElementById("timerSelect");
    const onlyReviewCheck = document.getElementById("onlyReviewCheck");
    const currentDatasetTitle = document.getElementById("currentDatasetTitle");
    const currentIndex = document.getElementById("currentIndex");
    const totalCount = document.getElementById("totalCount");
    const progressBar = document.getElementById("progressBar");

    const cardContainer = document.getElementById("cardContainer");
    const cardInner = document.getElementById("cardInner");
    const cardCategory = document.getElementById("cardCategory");
    const cardWord = document.getElementById("cardWord");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardExampleEn = document.getElementById("cardExampleEn");
    const cardExampleJa = document.getElementById("cardExampleJa");
    const timerStatusText = document.getElementById("timerStatusText");

    const btnPrev = document.getElementById("btnPrev");
    const btnNext = document.getElementById("btnNext");
    const btnMarkUnlearned = document.getElementById("btnMarkUnlearned");
    const btnMarkMastered = document.getElementById("btnMarkMastered");
    const btnSpeak = document.getElementById("btnSpeak");

    const btnOpenList = document.getElementById("btnOpenList");
    const btnCloseList = document.getElementById("btnCloseList");
    const btnCloseListFooter = document.getElementById("btnCloseListFooter");
    const listModal = document.getElementById("listModal");
    const wordListTable = document.getElementById("wordListTable");

    // --- データ読み込み ---
    async function loadDictionary(filename) {
      currentDatasetTitle.textContent = "データ読み込み中...";
      try {
        let list = [];
        if (filename === "ALL") {
          const files = [
            "words.json", "words-run.json", "words-take.json", "words-get.json",
            "words-make.json", "words-have.json", "words-hold.json", "words-give.json"
          ];
          for (const f of files) {
            try {
              const res = await fetch(f);
              if (res.ok) {
                const data = await res.json();
                list = list.concat(data);
              }
            } catch (err) {}
          }
        } else {
          const res = await fetch(filename);
          if (res.ok) list = await res.json();
        }

        currentWords = list;
        currentDatasetTitle.textContent = dictSelect.options[dictSelect.selectedIndex].text;
        applyFilter();
      } catch (err) {
        currentDatasetTitle.textContent = "読み込みエラー";
        cardWord.textContent = "データを読み込めませんでした";
      }
    }

    function applyFilter() {
      const onlyReview = onlyReviewCheck.checked;
      filteredIndices = [];
      for (let i = 0; i < currentWords.length; i++) {
        const item = currentWords[i];
        const isMastered = masteredSet.has(item.word || item.phrase || item.english);
        if (!onlyReview || !isMastered) {
          filteredIndices.push(i);
        }
      }
      currentPos = 0;
      updateUI();
    }

    // --- UI更新 ---
    function updateUI() {
      clearTimer();
      isFlipped = false;
      cardInner.classList.remove("rotate-y-180");
      timerStatusText.textContent = "タップで表面に戻ります";

      if (filteredIndices.length === 0) {
        currentIndex.textContent = "0";
        totalCount.textContent = "0";
        progressBar.style.width = "0%";
        cardWord.textContent = "該当する単語はありません";
        cardMeaning.textContent = "--";
        cardExampleEn.textContent = "--";
        cardExampleJa.textContent = "--";
        renderStatusButtons(false);
        return;
      }

      const rawIdx = filteredIndices[currentPos];
      const item = currentWords[rawIdx];
      const wordText = item.word || item.phrase || item.english || "";
      const meanText = item.meaning || item.japanese || item.translation || "";
      const exEn = item.example || item.example_en || "";
      const exJa = item.example_ja || item.example_jp || "";

      cardWord.textContent = wordText;
      cardMeaning.textContent = meanText;
      cardExampleEn.textContent = exEn || "--";
      cardExampleJa.textContent = exJa || "--";
      cardCategory.textContent = item.category || "COLLOCATION";

      currentIndex.textContent = currentPos + 1;
      totalCount.textContent = filteredIndices.length;
      progressBar.style.width = `${((currentPos + 1) / filteredIndices.length) * 100}%`;

      renderStatusButtons(masteredSet.has(wordText));
    }

    // 独立した2ボタンのハイライト切り替え
    function renderStatusButtons(isMastered) {
      if (isMastered) {
        // 「覚えた」がアクティブ
        btnMarkMastered.className = "flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-green-500 bg-green-500/20 text-green-300 shadow-[0_0_10px_rgba(34,197,94,0.2)]";
        btnMarkUnlearned.className = "flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-slate-800 bg-slate-950 text-slate-500 hover:text-slate-300 opacity-60";
      } else {
        // 「要復習」がアクティブ
        btnMarkUnlearned.className = "flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-amber-500/60 bg-amber-500/15 text-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.15)]";
        btnMarkMastered.className = "flex-1 py-2 rounded-lg font-bold text-xs transition flex items-center justify-center gap-1.5 border border-slate-800 bg-slate-950 text-slate-500 hover:text-slate-300 opacity-60";
      }
    }

    function clearTimer() {
      if (autoTimer) clearTimeout(autoTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      autoTimer = null;
      countdownInterval = null;
    }

    function flipCard() {
      if (filteredIndices.length === 0) return;
      isFlipped = !isFlipped;
      cardInner.classList.toggle("rotate-y-180", isFlipped);

      clearTimer();

      const timerSec = parseInt(timerSelect.value, 10);
      if (isFlipped && timerSec > 0) {
        let remain = timerSec;
        timerStatusText.innerHTML = `<span class="text-green-400 font-bold">${remain}秒後</span> に自動で次問へ`;
        
        countdownInterval = setInterval(() => {
          remain--;
          if (remain > 0) {
            timerStatusText.innerHTML = `<span class="text-green-400 font-bold">${remain}秒後</span> に自動で次問へ`;
          } else {
            clearInterval(countdownInterval);
          }
        }, 1000);

        autoTimer = setTimeout(() => {
          nextWord();
        }, timerSec * 1000);
      } else {
        timerStatusText.textContent = "タップで表面に戻ります";
      }
    }

    function nextWord() {
      if (filteredIndices.length === 0) return;
      if (currentPos < filteredIndices.length - 1) {
        currentPos++;
      } else {
        currentPos = 0;
      }
      updateUI();
    }

    function prevWord() {
      if (filteredIndices.length === 0) return;
      if (currentPos > 0) {
        currentPos--;
      } else {
        currentPos = filteredIndices.length - 1;
      }
      updateUI();
    }

    // 「覚えた」を設定
    function setMastered(isMastered) {
      if (filteredIndices.length === 0) return;
      const rawIdx = filteredIndices[currentPos];
      const wordText = currentWords[rawIdx].word || currentWords[rawIdx].phrase || currentWords[rawIdx].english;

      if (isMastered) {
        masteredSet.add(wordText);
      } else {
        masteredSet.delete(wordText);
      }
      saveMastered();
      renderStatusButtons(isMastered);

      if (onlyReviewCheck.checked && isMastered) {
        applyFilter();
      }
    }

    // --- 音声再生 ---
    function speakWord() {
      if (filteredIndices.length === 0) return;
      const rawIdx = filteredIndices[currentPos];
      const text = currentWords[rawIdx].word || currentWords[rawIdx].phrase || currentWords[rawIdx].english;
      if (!text) return;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate = 0.95;
      speechSynthesis.speak(u);
    }

    // --- 一覧モーダル生成 ---
    function renderListModal() {
      wordListTable.innerHTML = "";
      if (currentWords.length === 0) {
        wordListTable.innerHTML = `<div class="p-4 text-center text-slate-500">データがありません</div>`;
        return;
      }

      currentWords.forEach((item, idx) => {
        const wordText = item.word || item.phrase || item.english || "";
        const meanText = item.meaning || item.japanese || "";
        const isMastered = masteredSet.has(wordText);

        const row = document.createElement("div");
        row.className = "py-2 px-2 flex items-center justify-between hover:bg-slate-800/50 rounded cursor-pointer";
        row.innerHTML = `
          <div class="flex items-center gap-2 flex-1 pr-2">
            <span class="${isMastered ? 'text-green-400' : 'text-slate-600'}">
              <i class="fa-solid ${isMastered ? 'fa-circle-check' : 'fa-circle'} text-[10px]"></i>
            </span>
            <span class="font-bold text-white">${wordText}</span>
            <span class="text-slate-400 truncate max-w-[200px]">${meanText}</span>
          </div>
          <button class="text-[11px] px-2 py-0.5 rounded bg-slate-800 hover:bg-green-500 hover:text-black font-semibold text-slate-300">
            ジャンプ
          </button>
        `;
        row.addEventListener("click", () => {
          const matchPos = filteredIndices.indexOf(idx);
          if (matchPos !== -1) {
            currentPos = matchPos;
          } else {
            onlyReviewCheck.checked = false;
            applyFilter();
            currentPos = filteredIndices.indexOf(idx);
          }
          updateUI();
          listModal.classList.add("hidden");
        });
        wordListTable.appendChild(row);
      });
    }

    // --- イベントリスナー ---
    cardContainer.addEventListener("click", flipCard);
    btnNext.addEventListener("click", (e) => { e.stopPropagation(); nextWord(); });
    btnPrev.addEventListener("click", (e) => { e.stopPropagation(); prevWord(); });
    btnMarkUnlearned.addEventListener("click", (e) => { e.stopPropagation(); setMastered(false); });
    btnMarkMastered.addEventListener("click", (e) => { e.stopPropagation(); setMastered(true); });
    btnSpeak.addEventListener("click", (e) => { e.stopPropagation(); speakWord(); });

    dictSelect.addEventListener("change", () => loadDictionary(dictSelect.value));
    onlyReviewCheck.addEventListener("change", applyFilter);

    // 一覧モーダル
    btnOpenList.addEventListener("click", () => {
      renderListModal();
      listModal.classList.remove("hidden");
    });
    btnCloseList.addEventListener("click", () => listModal.classList.add("hidden"));
    btnCloseListFooter.addEventListener("click", () => listModal.classList.add("hidden"));

    // キーボード操作
    window.addEventListener("keydown", (e) => {
      if (!listModal.classList.contains("hidden")) return;
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        nextWord();
      } else if (e.code === "ArrowLeft") {
        prevWord();
      } else if (e.key === "1") {
        setMastered(false);
      } else if (e.key === "2") {
        setMastered(true);
      }
    });

    // 初期起動
    loadDictionary(dictSelect.value);
  </script>
</body>
</html>
