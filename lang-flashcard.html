<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- キャッシュ無効化 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>単語・コロケーション フラッシュカード | TOEIC RE:BOOT 730</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-[#0f172a]/95 backdrop-blur border-b border-slate-700 px-4 py-3.5">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-amber-400 font-bold text-sm transition">
        <i class="fa-solid fa-arrow-left"></i>
        <span>ポータルへ戻る</span>
      </a>
      <div class="flex items-center gap-2">
        <span id="categoryBadge" class="text-xs font-mono font-bold text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded border border-amber-800">
          ALL CARDS
        </span>
      </div>
    </div>
  </header>

  <!-- メインコンテナ -->
  <main class="max-w-xl mx-auto px-4 py-6 space-y-5 flex-1 w-full flex flex-col justify-center">

    <!-- コントロールバー（カテゴリ絞り込み & 進捗） -->
    <div class="flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <select id="categorySelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-500">
          <option value="all">すべての単語・表現</option>
          <option value="T1_Part2">Test 1 - Part 2</option>
          <option value="T1_Part3">Test 1 - Part 3</option>
          <option value="T1_Part4">Test 1 - Part 4</option>
          <option value="T2_Part2">Test 2 - Part 2</option>
          <option value="T2_Part3">Test 2 - Part 3</option>
          <option value="T2_Part4">Test 2 - Part 4</option>
        </select>
        <button id="shuffleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition">
          <i class="fa-solid fa-shuffle text-[11px] text-amber-400"></i>
          <span>シャッフル</span>
        </button>
      </div>
      <div class="font-mono text-sm font-bold text-slate-300">
        <span id="currentIndex" class="text-amber-400">1</span> / <span id="totalCount">0</span>
      </div>
    </div>

    <!-- プログレスバー -->
    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- フラッシュカード（3D Flip） -->
    <div class="perspective-1000 w-full h-80 sm:h-96 cursor-pointer" id="cardContainer">
      <div id="cardInner" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-2xl">
        
        <!-- 表面（英語・フレーズ） -->
        <div class="absolute inset-0 w-full h-full bg-[#1e293b] border border-slate-700 rounded-3xl p-6 sm:p-8 flex flex-col justify-between backface-hidden shadow-lg">
          <div class="flex justify-between items-start">
            <span id="cardTag" class="text-[11px] font-mono font-bold tracking-wider text-slate-400 bg-slate-900/80 px-2.5 py-1 rounded-md border border-slate-800">
              CATEGORY
            </span>
            <span class="text-xs text-slate-500 flex items-center gap-1">
              <i class="fa-solid fa-rotate text-[11px]"></i> タップでめくる
            </span>
          </div>

          <div class="text-center my-auto px-2">
            <h2 id="cardTerm" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide leading-tight">
              Loading...
            </h2>
          </div>

          <div class="text-center">
            <span class="text-xs font-semibold text-amber-400/90 tracking-widest uppercase">
              Click to reveal meaning
            </span>
          </div>
        </div>

        <!-- 裏面（日本語訳・例文・ポイント） -->
        <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-900 to-[#1e293b] border border-amber-500/40 rounded-3xl p-6 sm:p-8 flex flex-col justify-between backface-hidden rotate-y-180 shadow-lg">
          <div class="flex justify-between items-start">
            <span class="text-[11px] font-mono font-bold tracking-wider text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded-md border border-amber-800">
              MEANING & USAGE
            </span>
            <span class="text-xs text-slate-500 flex items-center gap-1">
              <i class="fa-solid fa-rotate text-[11px]"></i> 戻す
            </span>
          </div>

          <div class="space-y-4 my-auto text-left px-1 sm:px-3">
            <div>
              <p class="text-[11px] text-slate-400 font-bold mb-1">日本語訳</p>
              <p id="cardMeaning" class="text-xl sm:text-2xl font-bold text-amber-300 leading-snug">
                --
              </p>
            </div>
            <div id="cardExampleBox" class="bg-slate-950/60 p-3 rounded-xl border border-slate-800/80 text-xs sm:text-sm text-slate-300 leading-relaxed">
              <p class="text-[10px] text-slate-500 font-mono font-bold uppercase mb-0.5">CONTEXT</p>
              <p id="cardExample" class="text-slate-300 font-medium">--</p>
            </div>
          </div>

          <div class="text-center text-xs text-slate-500">
            タップで表面に戻ります
          </div>
        </div>

      </div>
    </div>

    <!-- 操作ボタンバー -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button id="prevBtn" class="py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-200 font-bold text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>前の単語</span>
      </button>
      <button id="nextBtn" class="py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
        <span>次の単語</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>

    <!-- キーボード操作ガイド（PC用） -->
    <p class="text-[11px] text-center text-slate-500 pt-1">
      キーボード操作：[Space] めくる / [←][→] 前後移動
    </p>

  </main>

  <!-- フッター -->
  <footer class="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
    <p>&copy; 2026 TOEIC RE:BOOT 730 Flashcard Lab</p>
  </footer>

  <script>
    // TOEIC公式問題集（Test 1 & Test 2 / Part 2, 3, 4）連動単語辞書データ
    const VOCAB_DATABASE = [
      // --- Test 1 Part 2 ---
      { cat: "T1_Part2", term: "be happy to do", meaning: "喜んで〜する", example: "I'd be happy to lead the session." },
      { cat: "T1_Part2", term: "set up", meaning: "設置する、設定する", example: "This computer should be set up in the corner." },
      { cat: "T1_Part2", term: "underneath", meaning: "〜の下に、真下に", example: "Yes, underneath the poster." },
      { cat: "T1_Part2", term: "registration fee", meaning: "登録料、参加費", example: "The conference registration fees haven't been paid." },
      { cat: "T1_Part2", term: "be supposed to do", meaning: "〜することになっている", example: "Who's supposed to lead the training session?" },
      { cat: "T1_Part2", term: "break room", meaning: "休憩室", example: "Why's the break room closed?" },
      { cat: "T1_Part2", term: "power source", meaning: "電源、電力源", example: "Will your company use solar energy or traditional power sources?" },
      { cat: "T1_Part2", term: "consult", meaning: "相談する、助言を求める", example: "Have you consulted the legal department yet?" },
      { cat: "T1_Part2", term: "revise", meaning: "修正する、改訂する", example: "Let's finish revising this on Monday." },
      { cat: "T1_Part2", term: "pick up", meaning: "（人を車で）迎えに行く", example: "Are you picking the client up from the airport?" },
      { cat: "T1_Part2", term: "leave on", meaning: "（電源を）つけたままにしておく", example: "No, it's OK if it's left on." },
      { cat: "T1_Part2", term: "candidate", meaning: "候補者", example: "Is she the best candidate?" },
      { cat: "T1_Part2", term: "out of the office", meaning: "不在で、オフィスを留守にして", example: "He's been out of the office all month." },
      { cat: "T1_Part2", term: "take one's shift", meaning: "（人の）シフト・勤務を代わる", example: "I can take your shift on Thursday." },
      { cat: "T1_Part2", term: "busiest season", meaning: "繁忙期、書き入れ時", example: "This is our busiest season." },
      { cat: "T1_Part2", term: "print out", meaning: "印刷する", example: "When should I print out the results of the survey?" },

      // --- Test 1 Part 3 ---
      { cat: "T1_Part3", term: "wrist discomfort", meaning: "手首の違和感・痛み", example: "Editors have been complaining about wrist discomfort." },
      { cat: "T1_Part3", term: "ergonomic", meaning: "人間工学に基づいた", example: "Add ergonomic mouse pads to the supply order." },
      { cat: "T1_Part3", term: "bulk order", meaning: "大量注文", example: "Which companies can fill a bulk order right away?" },
      { cat: "T1_Part3", term: "cost estimate", meaning: "見積もり、概算費用", example: "I'll e-mail you the final cost estimate." },
      { cat: "T1_Part3", term: "fill out a form", meaning: "用紙に記入する", example: "Please fill out this form while we wait." },
      { cat: "T1_Part3", term: "dues payment", meaning: "会費の支払い", example: "We do require a small dues payment." },
      { cat: "T1_Part3", term: "team-building event", meaning: "チームビルディング行事", example: "Choose an activity for our team-building event." },
      { cat: "T1_Part3", term: "distribute", meaning: "配布する、流通させる", example: "Buy our snack mix to distribute on their flights." },
      { cat: "T1_Part3", term: "awards banquet", meaning: "表彰式、祝賀晩餐会", example: "For the company's employee awards banquet." },
      { cat: "T1_Part3", term: "competitor", meaning: "競合他社", example: "Leafy Landing Gardens is our biggest competitor." },
      { cat: "T1_Part3", term: "confidential", meaning: "機密の、秘密の", example: "Protocols for keeping patient data confidential." },
      { cat: "T1_Part3", term: "locate", meaning: "（場所を）見つける、特定する", example: "Use the scanner to quickly locate the shelf number." },
      { cat: "T1_Part3", term: "compliant", meaning: "（法令・規格に）準拠した", example: "Our design is now compliant with new guidelines." },
      { cat: "T1_Part3", term: "carbon footprint", meaning: "二酸化炭素排出量、環境負荷", example: "Minimizing the carbon footprint of his property." },
      { cat: "T1_Part3", term: "promotional item / giveaway", meaning: "販促品、ノベルティ", example: "Did we get permission to order promotional items?" },

      // --- Test 1 Part 4 ---
      { cat: "T1_Part4", term: "heighten visibility", meaning: "認知度・知名度を高める", example: "Wrap-Tech will heighten your business's visibility." },
      { cat: "T1_Part4", term: "durable", meaning: "耐久性のある、丈夫な", example: "Large stickers made of durable vinyl material." },
      { cat: "T1_Part4", term: "initiative", meaning: "新たな取り組み、構想", example: "It's my pleasure to announce an exciting initiative." },
      { cat: "T1_Part4", term: "coat check", meaning: "クローク、手荷物預かり所", example: "Visit our booth located near the coat check." },
      { cat: "T1_Part4", term: "state-of-the-art", meaning: "最先端の", example: "This state-of-the-art wireless system offers crystal-clear audio." },
      { cat: "T1_Part4", term: "demonstration", meaning: "実演、デモ", example: "Call our sales team for a free demonstration." },
      { cat: "T1_Part4", term: "heavy-duty", meaning: "高耐久の、業務用の", example: "Two of our heavy-duty copiers are down." },
      { cat: "T1_Part4", term: "untapped potential", meaning: "未開拓の可能性", example: "There's untapped potential in influencer partnerships." },
      { cat: "T1_Part4", term: "sustainable farming", meaning: "持続可能な農業", example: "Our commitment to sustainable farming practices." },
      { cat: "T1_Part4", term: "supervise", meaning: "監督する、見守る", example: "Each staff member will be responsible for supervising five machines." },

      // --- Test 2 Part 2 ---
      { cat: "T2_Part2", term: "packaging machine", meaning: "包装機、パッケージングマシン", example: "Which machine has to be repaired? - The packaging machine." },
      { cat: "T2_Part2", term: "career fair", meaning: "合同就職説明会", example: "Who will be representing our company at the career fair?" },
      { cat: "T2_Part2", term: "send again", meaning: "再送する", example: "I can't find the e-mail. - OK, I'll send it again." },
      { cat: "T2_Part2", term: "get in contact with", meaning: "〜と連絡を取る", example: "You were able to get in contact with the technician, weren't you?" },
      { cat: "T2_Part2", term: "meet a deadline", meaning: "締め切りに間に合わせる", example: "How will we meet the production deadline?" },
      { cat: "T2_Part2", term: "earnings summary", meaning: "収益概要、決算まとめ", example: "I'm missing last quarter's earnings summary." },
      { cat: "T2_Part2", term: "relocate", meaning: "移転する", example: "Why is the store relocating to the city center?" },
      { cat: "T2_Part2", term: "pharmacist", meaning: "薬剤師", example: "Can I talk to the pharmacist about my prescription?" },
      { cat: "T2_Part2", term: "organize", meaning: "企画する、主催する", example: "Jee-Soo organized the workshop." },
      { cat: "T2_Part2", term: "supplier", meaning: "納入業者、サプライヤー", example: "I've already contacted a supplier." },

      // --- Test 2 Part 3 ---
      { cat: "T2_Part3", term: "job seeker", meaning: "求職者", example: "Run an ad in your newspaper to attract the best job seekers." },
      { cat: "T2_Part3", term: "on display", meaning: "展示されている", example: "I'd like to buy the kitchen table on display." },
      { cat: "T2_Part3", term: "renovation", meaning: "改修工事", example: "We closed it for renovations to the boardwalk." },
      { cat: "T2_Part3", term: "book a venue", meaning: "会場を予約する", example: "I need to book a venue for our company's conference." },
      { cat: "T2_Part3", term: "water-resistant", meaning: "耐水性の、撥水の", example: "Backpacks made with lightweight and water-resistant fabric." },
      { cat: "T2_Part3", term: "keep freezing", meaning: "フリーズし続ける", example: "The program keeps freezing." },
      { cat: "T2_Part3", term: "keep up with demand", meaning: "需要に追いつく", example: "I'm a little concerned about keeping up with demand." },
      { cat: "T2_Part3", term: "submit an application", meaning: "応募書類を提出する", example: "Do you think I can suggest that he submit an application?" },
      { cat: "T2_Part3", term: "demolish", meaning: "解体する、取り壊す", example: "My proposal is to demolish the building and sell the land empty." },
      { cat: "T2_Part3", term: "e-newsletter", meaning: "メールマガジン", example: "Sending out a regular e-newsletter is a great way to increase sales." },
      { cat: "T2_Part3", term: "call in sick", meaning: "病欠の電話連絡をする", example: "Well, Marcela called in sick." },
      { cat: "T2_Part3", term: "top priority", meaning: "最優先事項", example: "Maintaining good relationships with customers is our top priority." },

      // --- Test 2 Part 4 ---
      { cat: "T2_Part4", term: "book signing", meaning: "書籍のサイン会", example: "Mei Na Wu will be signing copies of her new novel." },
      { cat: "T2_Part4", term: "track record", meaning: "実績、実績の記録", example: "We have a long track record of helping new business owners." },
      { cat: "T2_Part4", term: "adjustable", meaning: "調節可能な", example: "All desks and chairs should be adjustable." },
      { cat: "T2_Part4", term: "paperwork", meaning: "事務書類、書類手続き", example: "I'm going to send all the paperwork electronically." },
      { cat: "T2_Part4", term: "outsource", meaning: "外注する、外部委託する", example: "We'll need to outsource some of the production to a factory in Europe." },
      { cat: "T2_Part4", term: "passenger deck", meaning: "客室デッキ、旅客甲板", example: "Passengers must exit their cars and go to the passenger decks." },
      { cat: "T2_Part4", term: "secondhand furniture", meaning: "中古家具", example: "The Midwest's largest secondhand furniture store." },
      { cat: "T2_Part4", term: "get a quote", meaning: "見積もり・査定を取得する", example: "To get a quote, call Daniel Chen at 555-0100." },
      { cat: "T2_Part4", term: "innovative cuisine", meaning: "革新的な料理", example: "Praises us for our innovative take on traditional Chinese cuisine." },
      { cat: "T2_Part4", term: "orientation session", meaning: "新人研修、オリエンテーション", example: "Trying to register online for a new-employee orientation session." }
    ];

    let currentList = [...VOCAB_DATABASE];
    let cardIdx = 0;
    let isFlipped = false;

    // DOM要素
    const cardContainer = document.getElementById("cardContainer");
    const cardInner = document.getElementById("cardInner");
    const cardTag = document.getElementById("cardTag");
    const cardTerm = document.getElementById("cardTerm");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardExample = document.getElementById("cardExample");
    const currentIndexEl = document.getElementById("currentIndex");
    const totalCountEl = document.getElementById("totalCount");
    const progressBar = document.getElementById("progressBar");
    const categorySelect = document.getElementById("categorySelect");
    const categoryBadge = document.getElementById("categoryBadge");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function updateCard() {
      if (currentList.length === 0) {
        cardTerm.textContent = "該当する単語がありません";
        cardMeaning.textContent = "--";
        cardExample.textContent = "--";
        cardTag.textContent = "NONE";
        return;
      }

      // カードを表面に戻す
      if (isFlipped) {
        cardInner.classList.remove("rotate-y-180");
        isFlipped = false;
      }

      const item = currentList[cardIdx];
      cardTag.textContent = item.cat.replace("_", " ");
      cardTerm.textContent = item.term;
      cardMeaning.textContent = item.meaning;
      cardExample.textContent = item.example;

      currentIndexEl.textContent = cardIdx + 1;
      totalCountEl.textContent = currentList.length;

      const progress = ((cardIdx + 1) / currentList.length) * 100;
      progressBar.style.width = progress + "%";
    }

    function flipCard() {
      isFlipped = !isFlipped;
      cardInner.classList.toggle("rotate-y-180", isFlipped);
    }

    function nextCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx + 1) % currentList.length;
      updateCard();
    }

    function prevCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx - 1 + currentList.length) % currentList.length;
      updateCard();
    }

    // イベントリスナー
    cardContainer.addEventListener("click", flipCard);
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextCard(); });
    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevCard(); });

    // カテゴリフィルター
    categorySelect.addEventListener("change", (e) => {
      const selected = e.target.value;
      if (selected === "all") {
        currentList = [...VOCAB_DATABASE];
        categoryBadge.textContent = "ALL CARDS";
      } else {
        currentList = VOCAB_DATABASE.filter(item => item.cat === selected);
        categoryBadge.textContent = selected.replace("_", " ");
      }
      cardIdx = 0;
      updateCard();
    });

    // シャッフル機能
    shuffleBtn.addEventListener("click", () => {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      cardIdx = 0;
      updateCard();
    });

    // キーボードショートカット
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        nextCard();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        prevCard();
      }
    });

    // 初期化実行
    updateCard();
  </script>
</body>
</html>
