    const TAKE_DATA = [
      {"word": "take advantage of", "meaning": "〜を利用する・活用する", "example": "We should take advantage of the early registration discount.", "example_jp": "早期登録割引をぜひ活用すべきです。", "category": "基本動詞: take"},
      {"word": "take into account", "meaning": "〜を考慮に入れる", "example": "The planner took local regulations into account.", "example_jp": "設計担当者は地域の規制を考慮に入れました。", "category": "基本動詞: take"},
      {"word": "take place", "meaning": "（行事などが）開催される・行われる", "example": "The orientation will take place in the main conference hall.", "example_jp": "オリエンテーションは大会議室で開催されます。", "category": "基本動詞: take"},
      {"word": "take over", "meaning": "引き継ぐ・引き受ける", "example": "Mr. Davis will take over the shift tomorrow afternoon.", "example_jp": "デイビスさんが明日の午後のシフトを引き継ぎます。", "category": "基本動詞: take"},
      {"word": "take part in", "meaning": "〜に参加する", "example": "All department members took part in the training seminar.", "example_jp": "部門の全メンバーが研修セミナーに参加しました。", "category": "基本動詞: take"}
    ];

    // 4. 基本動詞: get
    const GET_DATA = [
      {"word": "get in touch with", "meaning": "〜と連絡を取る", "example": "Please get in touch with the supplier regarding shipment dates.", "example_jp": "発送日について納入業者と連絡を取ってください。", "category": "基本動詞: get"},
      {"word": "get along with", "meaning": "〜とうまくやっていく", "example": "The new manager gets along well with the factory team.", "example_jp": "新しい管理職は工場のチームとうまくやっています。", "category": "基本動詞: get"},
      {"word": "get rid of", "meaning": "〜を処分する・取り除く", "example": "We need to get rid of outdated office equipment.", "example_jp": "不要になった古い事務機器を処分する必要があります。", "category": "基本動詞: get"},
      {"word": "get used to", "meaning": "〜に慣れる", "example": "Workers quickly got used to the upgraded scanner system.", "example_jp": "作業員たちは更新されたスキャナーシステムにすぐに慣れました。", "category": "基本動詞: get"}
    ];

    // 5. 基本動詞: make
    const MAKE_DATA = [
      {"word": "make sure", "meaning": "必ず〜する・確かめる", "example": "Make sure to turn off all copiers before leaving the room.", "example_jp": "退室する前に必ずすべてのコピー機の電源を切ってください。", "category": "基本動詞: make"},
      {"word": "make progress", "meaning": "進歩する・進展する", "example": "The engineering department made great progress this month.", "example_jp": "技術部門は今月大きな進展を遂げました。", "category": "基本動詞: make"},
      {"word": "make an appointment", "meaning": "予約を取る・面会の約束をする", "example": "She made an appointment to meet with the human resources director.", "example_jp": "彼女は人事部長と面会する予約を取りました。", "category": "基本動詞: make"},
      {"word": "make a decision", "meaning": "決定を下す", "example": "The board will make a decision on the acquisition next week.", "example_jp": "取締役会は来週、買収に関する決定を下します。", "category": "基本動詞: make"}
    ];

    // 6. 基本動詞: have
    const HAVE_DATA = [
      {"word": "have an impact on", "meaning": "〜に影響を与える", "example": "Market fluctuations have a major impact on quarterly revenues.", "example_jp": "市場の変動は四半期収益に大きな影響を与えます。", "category": "基本動詞: have"},
      {"word": "have in mind", "meaning": "念頭に置いている・考えている", "example": "What specific timeline do you have in mind for the release?", "example_jp": "発売に向けて具体的にどのような日程をお考えですか？", "category": "基本動詞: have"},
      {"word": "have access to", "meaning": "〜にアクセスできる・利用できる", "example": "Only certified specialists have access to confidential data.", "example_jp": "公認専門家のみが機密データへのアクセス権を持っています。", "category": "基本動詞: have"}
    ];

    // 全動詞を単一データベースに結合
    const VOCAB_DATABASE = [
      ...RUN_DATA,
      ...HOLD_DATA,
      ...TAKE_DATA,
      ...GET_DATA,
      ...MAKE_DATA,
      ...HAVE_DATA
    ];

    let currentList = [];
    let cardIdx = 0;
    let isFlipped = false;

    // DOM要素
    const cardContainer = document.getElementById("cardContainer");
    const cardInner = document.getElementById("cardInner");
    const cardTag = document.getElementById("cardTag");
    const cardTerm = document.getElementById("cardTerm");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardExample = document.getElementById("cardExample");
    const cardExampleJp = document.getElementById("cardExampleJp");
    const currentIndexEl = document.getElementById("currentIndex");
    const totalCountEl = document.getElementById("totalCount");
    const progressBar = document.getElementById("progressBar");
    const categorySelect = document.getElementById("categorySelect");
    const categoryBadge = document.getElementById("categoryBadge");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // 全カテゴリーを自動抽出してセレクトボックスを生成
    function initCategories() {
      const categories = [...new Set(VOCAB_DATABASE.map(item => item.category))];
      categorySelect.innerHTML = `<option value="all">すべての動詞表現 (${VOCAB_DATABASE.length})</option>`;
      categories.forEach(cat => {
        const count = VOCAB_DATABASE.filter(item => item.category === cat).length;
        categorySelect.innerHTML += `<option value="${cat}">${cat} (${count})</option>`;
      });
      currentList = [...VOCAB_DATABASE];
    }

    function updateCard() {
      if (currentList.length === 0) {
        cardTerm.textContent = "該当する表現がありません";
        cardMeaning.textContent = "--";
        cardExample.textContent = "--";
        cardExampleJp.textContent = "--";
        cardTag.textContent = "NONE";
        return;
      }

      if (isFlipped) {
        cardInner.classList.remove("rotate-y-180");
        isFlipped = false;
      }

      const item = currentList[cardIdx];
      cardTag.textContent = item.category || "基本表現";
      cardTerm.textContent = item.word;
      cardMeaning.textContent = item.meaning;
      cardExample.textContent = item.example || "";
      cardExampleJp.textContent = item.example_jp || "";

      currentIndexEl.textContent = cardIdx + 1;
      totalCountEl.textContent = currentList.length;

      const progress = ((cardIdx + 1) / currentList.length) * 100;
      progressBar.style.width = progress + "%";
    }

    function flipCard() {
      isFlipped = !isFlipped;
      cardInner.classList.toggle("rotate-y-180", isFlipped);
    }

    function nextCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx + 1) % currentList.length;
      updateCard();
    }

    function prevCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx - 1 + currentList.length) % currentList.length;
      updateCard();
    }

    // イベント
    cardContainer.addEventListener("click", flipCard);
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextCard(); });
    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevCard(); });

    categorySelect.addEventListener("change", (e) => {
      const selected = e.target.value;
      if (selected === "all") {
        currentList = [...VOCAB_DATABASE];
        categoryBadge.textContent = "ALL CARDS";
      } else {
        currentList = VOCAB_DATABASE.filter(item => item.category === selected);
        categoryBadge.textContent = selected;
      }
      cardIdx = 0;
      updateCard();
    });

    shuffleBtn.addEventListener("click", () => {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      cardIdx = 0;
      updateCard();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        nextCard();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        prevCard();
      }
    });

    // 初期起動
    initCategories();
    updateCard();
  </script>
</body>
</html>
