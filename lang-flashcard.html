<!-- 対象ファイル: lang-flashcard.html (インスタ風ミニマル・リメイク版) -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>頻出コロケーション・フレーズ反復特訓 | TOEIC RE:BOOT 730</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: #F4F7FB;
      color: #102542;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-chakra { font-family: 'Chakra Petch', sans-serif; }
    .perspective-1000 { perspective: 1200px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }

    .kobe-navy { color: #102542; }
    .kobe-red { color: #CD2D2D; }

    .card-surface {
      background: #FFFFFF;
      border: 1px solid #DCE4EE;
      box-shadow: 0 12px 28px -6px rgba(16, 37, 66, 0.08), 0 4px 10px -2px rgba(16, 37, 66, 0.04);
    }
    .kobe-btn-glow {
      transition: all 0.2s ease;
    }
    .kobe-btn-glow:hover {
      border-color: #CD2D2D;
      box-shadow: 0 0 14px rgba(205, 45, 45, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- スリムヘッダー（神戸タータン仕様） -->
  <header class="border-b border-[#DCE4EE] bg-white/95 backdrop-blur sticky top-0 z-40">
    <div class="h-[3px] bg-[#CD2D2D] w-full"></div>
    <div class="max-w-lg mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <!-- 左：戻る + タイトル -->
      <div class="flex items-center gap-2 shrink-0">
        <a href="index.html" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-500 hover:text-[#CD2D2D] hover:bg-[#F4F7FB] transition" title="トップへ戻る">
          <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <h1 class="text-sm sm:text-base font-black tracking-wide text-[#102542]">
          コロケーション特訓
        </h1>
      </div>

      <!-- 右：設定ドロワー開閉 + 一覧 -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button id="btnToggleSettings" onclick="toggleSettingsDrawer()" class="px-2.5 py-1.5 rounded-lg bg-[#F4F7FB] hover:bg-slate-200/70 border border-[#DCE4EE] text-[#102542] text-xs font-bold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-sliders text-[#CD2D2D]"></i>
          <span>設定</span>
        </button>
        <button id="btnOpenList" class="px-2.5 py-1.5 rounded-lg bg-white hover:bg-[#F4F7FB] border border-[#DCE4EE] text-[#102542] hover:text-[#CD2D2D] text-xs font-bold flex items-center gap-1 shadow-2xs transition">
          <i class="fa-solid fa-list-ul text-[#CD2D2D]"></i>
          <span>一覧</span>
        </button>
      </div>
    </div>

    <!-- 引き出し式・設定パネル（普段は隠れていて画面を圧迫しない） -->
    <div id="settingsDrawer" class="hidden border-t border-[#DCE4EE] bg-white px-4 py-3.5 shadow-lg">
      <div class="max-w-lg mx-auto space-y-3 text-xs">
        <!-- 教材選択 -->
        <div class="space-y-1">
          <label for="dictSelect" class="font-bold text-slate-500 flex items-center gap-1">
            <i class="fa-solid fa-book text-[#CD2D2D]"></i> 教材・辞書を選択
          </label>
          <select id="dictSelect" class="w-full bg-[#F4F7FB] text-[#102542] border border-[#DCE4EE] rounded-xl px-3 py-2 text-xs font-bold focus:outline-none focus:border-[#CD2D2D]">
            <option value="ALL">★ すべての辞書を結合 (全データ一括)</option>
            <option value="words.json">一般ビジネス・頻出コロケーション</option>
            <option value="words-run.json">基本動詞: run</option>
            <option value="words-take.json">基本動詞: take</option>
            <option value="words-get.json">基本動詞: get</option>
            <option value="words-make.json">基本動詞: make</option>
            <option value="words-have.json">基本動詞: have</option>
            <option value="words-hold.json">基本動詞: hold</option>
            <option value="words-give.json">基本動詞: give</option>
            <option value="words-verbs.json" selected>重要動詞まとめ (混合版)</option>
            <option value="words-deck1_intransitive_100.json">群動詞①：自動詞＋前置詞 (100選)</option>
            <option value="words-deck2_transitive_80.json">群動詞②：他動詞＋O＋前置詞 (80選)</option>
            <option value="words-deck3_basic_100.json">群動詞③：基本動詞＋副詞・前置詞 (100選)</option>
          </select>
        </div>

        <!-- 2列：出題数 ＆ 自動タイマー -->
        <div class="grid grid-cols-2 gap-2.5">
          <div class="space-y-1">
            <label for="deckSizeSelect" class="font-bold text-slate-500">出題数</label>
            <select id="deckSizeSelect" onchange="changeDeckSize(this.value)" class="w-full bg-[#F4F7FB] text-[#102542] border border-[#DCE4EE] rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none">
              <option value="10" selected>10問（サクッと）</option>
              <option value="20">20問</option>
              <option value="50">50問</option>
              <option value="all">全問</option>
            </select>
          </div>
          <div class="space-y-1">
            <label for="timerSelect" class="font-bold text-slate-500">自動送りタイマー</label>
            <select id="timerSelect" class="w-full bg-[#F4F7FB] text-[#102542] border border-[#DCE4EE] rounded-xl px-2.5 py-2 text-xs font-bold focus:outline-none">
              <option value="0">OFF（手動）</option>
              <option value="3">3秒（即断）</option>
              <option value="10" selected>10秒（標準）</option>
              <option value="15">15秒（音読）</option>
            </select>
          </div>
        </div>

        <!-- 文字サイズ調整 & 閉じる -->
        <div class="flex items-center justify-between pt-1 border-t border-[#DCE4EE]">
          <div class="flex items-center gap-2">
            <span class="font-bold text-slate-500">文字サイズ:</span>
            <div class="flex items-center bg-[#F4F7FB] border border-[#DCE4EE] rounded-lg overflow-hidden">
              <button onclick="adjustFontSize(-1)" class="px-3 py-1 text-slate-600 hover:bg-white font-bold">小</button>
              <button onclick="adjustFontSize(1)" class="px-3 py-1 text-slate-600 hover:bg-white border-l border-[#DCE4EE] font-bold">大</button>
            </div>
          </div>
          <button onclick="toggleSettingsDrawer()" class="px-3 py-1.5 rounded-lg bg-[#102542] text-white font-bold">
            完了
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- メイン学習エリア -->
  <main class="w-full max-w-lg mx-auto px-4 py-3 flex flex-col flex-1 justify-between">

    <!-- ミニマル進捗＆フィルターバー（1行完結・折り返しゼロ） -->
    <div class="space-y-2 mb-2">
      <div class="flex items-center justify-between text-xs">
        <div class="flex items-center gap-2">
          <span class="font-chakra font-bold text-sm text-[#102542]" id="progressIndex">0 / 0</span>
          <span id="currentDictLabel" class="text-[11px] text-slate-400 truncate max-w-[140px]">全辞書</span>
        </div>

        <!-- すべて / 未習得 切り替えピル -->
        <div class="inline-flex rounded-full bg-white p-0.5 border border-[#DCE4EE]">
          <button onclick="setFilterMode('all')" id="btnFilterAll" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#102542] text-white transition">
            すべて
          </button>
          <button onclick="setFilterMode('review')" id="btnFilterReview" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold text-slate-500 hover:text-[#CD2D2D] transition">
            未習得 <span id="unmasteredBadge" class="font-chakra">0</span>
          </button>
        </div>
      </div>

      <!-- インスタストーリー風プログレスバー -->
      <div class="w-full h-1 bg-[#DCE4EE] rounded-full overflow-hidden">
        <div id="progressBarFill" class="h-full bg-[#CD2D2D] transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- 3Dフラッシュカード本体（スワイプ＆タップ対応） -->
    <div id="cardTouchArea" class="w-full flex-1 min-h-[360px] sm:min-h-[400px] max-h-[480px] perspective-1000 cursor-pointer my-1" onclick="flipCard()">
      <div id="flashCard" class="w-full h-full relative transform-style-3d transition-transform duration-500 rounded-3xl">

        <!-- ==========================================
             【表面】極限までシンプル（フレーズと音声のみ）
             ========================================== -->
        <div class="card-surface rounded-3xl p-6 flex flex-col justify-between items-center text-center h-full min-h-[360px] sm:min-h-[400px]">
          <!-- 上部：極小カテゴリタグ & ステータス -->
          <div class="w-full flex items-center justify-between gap-2">
            <span id="cardCategoryBadge" class="text-[11px] font-bold px-2.5 py-1 rounded-full bg-[#F4F7FB] text-slate-600 border border-[#DCE4EE] truncate max-w-[200px]">
              COLLOCATION
            </span>
            <span id="cardStatusBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-red-50 text-[#CD2D2D] border border-red-200 hidden">
              要復習
            </span>
          </div>

          <!-- 中央：主役の英語フレーズのみをドーンと表示 -->
          <div class="my-auto px-2 space-y-5 w-full flex flex-col items-center">
            <div id="cardWord" class="font-black text-[#102542] text-3xl sm:text-4xl tracking-tight leading-snug transition-all duration-200">
              読み込み中...
            </div>

            <!-- 独立した大きな音声再生ボタン -->
            <button onclick="playSpeech(event)" class="w-12 h-12 rounded-full bg-[#F4F7FB] hover:bg-red-50 border border-[#DCE4EE] hover:border-[#CD2D2D] text-[#102542] hover:text-[#CD2D2D] flex items-center justify-center text-lg transition shadow-2xs active:scale-90" title="発音を聴く">
              <i class="fa-solid fa-volume-high"></i>
            </button>
          </div>

          <!-- 下部：控えめなドットインジケーター（表面＝左が濃い） -->
          <div class="flex items-center gap-1.5">
            <span class="w-4 h-1.5 rounded-full bg-[#102542]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#DCE4EE]"></span>
          </div>
        </div>

        <!-- ==========================================
             【裏面】充実の解説・意味・例文・発音
             ========================================== -->
        <div class="absolute inset-0 backface-hidden rotate-y-180 card-surface rounded-3xl p-5 sm:p-6 flex flex-col justify-between text-left h-full min-h-[360px] sm:min-h-[400px] border-2 border-[#102542] overflow-y-auto">
          <!-- 上部：ラベル & 発音ボタン -->
          <div class="w-full flex items-center justify-between pb-2.5 border-b border-[#DCE4EE]">
            <span class="text-[11px] font-bold text-emerald-700 flex items-center gap-1">
              <i class="fa-solid fa-circle-check"></i> ANSWER &amp; CONTEXT
            </span>
            <button onclick="playSpeech(event, true)" class="px-2.5 py-1 rounded-full bg-[#F4F7FB] hover:bg-red-50 border border-[#DCE4EE] text-[#102542] hover:text-[#CD2D2D] text-xs font-bold flex items-center gap-1 transition">
              <i class="fa-solid fa-volume-high text-[#CD2D2D]"></i> 例文音声
            </button>
          </div>

          <!-- 中央：意味 ＋ 正解フレーズ ＋ 例文・対訳 -->
          <div class="my-auto py-3 space-y-4">
            <!-- 1. 意味（大きく赤字でインパクト重視） -->
            <div>
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">意味</div>
              <div id="cardMeaning" class="text-2xl sm:text-3xl font-black text-[#CD2D2D] leading-tight">
                --
              </div>
            </div>

            <!-- 2. 正解フレーズ（穴埋め問題の場合や確認用） -->
            <div id="cardAnswerBox" class="bg-[#F4F7FB] rounded-xl px-3.5 py-2.5 border border-[#DCE4EE]">
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-0.5">フレーズ</div>
              <div id="cardAnswerPhrase" class="text-base sm:text-lg font-extrabold text-[#102542]">--</div>
            </div>

            <!-- 3. コンテクスト例文（英語＋日本語） -->
            <div class="bg-[#F4F7FB] rounded-xl p-3.5 border border-[#DCE4EE] space-y-1.5">
              <div class="text-[10px] font-bold text-[#102542] uppercase tracking-wider flex items-center gap-1">
                <i class="fa-solid fa-quote-left text-[#CD2D2D]"></i> 実戦コンテクスト例文
              </div>
              <div id="cardExampleEnBack" class="text-xs sm:text-sm font-bold text-[#102542] leading-relaxed">
                --
              </div>
              <div id="cardExampleJa" class="text-xs text-slate-600 leading-relaxed pt-1.5 border-t border-[#DCE4EE]">
                --
              </div>
            </div>
          </div>

          <!-- 下部：タイマー表示 & ドットインジケーター（裏面＝右が濃い） -->
          <div class="w-full flex items-center justify-between pt-1">
            <span id="timerStatusText" class="text-[11px] text-slate-400 font-medium">タップで表面へ</span>
            <div class="flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-[#DCE4EE]"></span>
              <span class="w-4 h-1.5 rounded-full bg-[#CD2D2D]"></span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- スマート下部アクションエリア（表と裏でボタンが切り替わる1段設計） -->
    <div class="w-full pt-2 pb-3">
      <!-- ① 表面のときの操作バー -->
      <div id="frontActionBar" class="flex items-center gap-2.5">
        <button onclick="prevCard()" class="w-12 h-13 py-3.5 rounded-2xl bg-white hover:bg-[#F4F7FB] border border-[#DCE4EE] text-slate-600 flex items-center justify-center transition active:scale-95" title="前のカード">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button onclick="flipCard()" class="flex-1 py-3.5 px-5 rounded-2xl bg-[#102542] hover:bg-[#1a3860] text-white font-black text-sm sm:text-base transition flex items-center justify-center gap-2 shadow-md active:scale-95 kobe-btn-glow">
          <span>答え・解説を見る</span>
          <i class="fa-solid fa-rotate text-red-400 text-xs"></i>
        </button>
        <button onclick="nextCard()" class="w-12 h-13 py-3.5 rounded-2xl bg-white hover:bg-[#F4F7FB] border border-[#DCE4EE] text-slate-600 flex items-center justify-center transition active:scale-95" title="次のカード">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>

      <!-- ② 裏面のときの習得判定バー（2択に集中） -->
      <div id="backActionBar" class="hidden grid grid-cols-2 gap-3">
        <button onclick="handleGrade(false)" class="py-3.5 px-4 rounded-2xl bg-white hover:bg-red-50 border-2 border-[#CD2D2D]/30 hover:border-[#CD2D2D] text-[#CD2D2D] font-black text-sm sm:text-base transition flex items-center justify-center gap-2 shadow-sm active:scale-95">
          <i class="fa-solid fa-xmark text-lg"></i>
          <span>まだ（要復習）</span>
        </button>
        <button onclick="handleGrade(true)" class="py-3.5 px-4 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm sm:text-base transition flex items-center justify-center gap-2 shadow-md active:scale-95">
          <i class="fa-solid fa-check text-lg"></i>
          <span>覚えた！</span>
        </button>
      </div>
    </div>

  </main>

  <!-- 単語・フレーズの一覧モーダル -->
  <div id="listModal" class="fixed inset-0 bg-[#102542]/70 backdrop-blur-sm hidden flex items-center justify-center p-3 sm:p-4 z-50">
    <div class="max-w-lg w-full h-[85vh] bg-white rounded-2xl p-4 sm:p-5 flex flex-col border border-[#DCE4EE] shadow-2xl overflow-hidden">
      <div class="flex items-center justify-between pb-3 border-b border-[#DCE4EE]">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-list-ul text-[#CD2D2D]"></i>
          <h3 class="text-sm sm:text-base font-bold text-[#102542]">収録フレーズ一覧</h3>
          <span class="text-xs text-slate-500 font-mono" id="modalListCount"></span>
        </div>
        <button id="btnCloseList" class="text-slate-400 hover:text-[#102542] text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="py-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-xs text-slate-400"></i>
          <input type="text" id="listSearchInput" oninput="filterList()" placeholder="英語フレーズ、日本語訳で検索..." 
            class="w-full pl-8 pr-3 py-2 rounded-xl bg-[#F4F7FB] border border-[#DCE4EE] text-xs text-[#102542] placeholder:text-slate-400 focus:outline-none focus:border-[#CD2D2D]">
        </div>
      </div>

      <div class="flex-1 overflow-y-auto space-y-2.5 pr-1" id="listContainer"></div>
    </div>
  </div>

  <!-- コンパクトフッター -->
  <footer class="border-t border-[#DCE4EE] bg-white py-4 text-center text-[11px] text-slate-400 space-y-1">
    <p class="font-semibold text-[#102542]">© 2026 TOEIC RE:BOOT 730<a href="ura_index.html" class="text-slate-400 hover:text-slate-600">.</a></p>
    <p>
      Amazonアソシエイト参加中
      <span class="mx-1.5">|</span>
      <a href="recommend.html" class="hover:text-[#CD2D2D] underline">おすすめ教材</a>
      <span class="mx-1.5">|</span>
      <a href="contact.html" class="hover:text-[#CD2D2D]">不具合報告</a>
    </p>
  </footer>

  <!-- スクリプト制御 -->
  <script>
    let currentWords = [];
    let activeDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let filterMode = 'all';
    let autoTimer = null;
    let countdownInterval = null;

    const STORAGE_KEY = "toeic_mastered_words_v1";
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...masteredSet]));
    }

    const fontSizes = [
      'text-2xl sm:text-3xl',
      'text-3xl sm:text-4xl', // 標準
      'text-4xl sm:text-5xl'
    ];
    let currentFontIndex = parseInt(localStorage.getItem('flashcard_font_level') || '1', 10);

    // DOM要素
    const dictSelect = document.getElementById("dictSelect");
    const timerSelect = document.getElementById("timerSelect");
    const flashCard = document.getElementById("flashCard");
    const cardCategoryBadge = document.getElementById("cardCategoryBadge");
    const cardStatusBadge = document.getElementById("cardStatusBadge");
    const cardWord = document.getElementById("cardWord");
    const cardExampleEnBack = document.getElementById("cardExampleEnBack");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardExampleJa = document.getElementById("cardExampleJa");
    const timerStatusText = document.getElementById("timerStatusText");
    const progressIndex = document.getElementById("progressIndex");
    const progressBarFill = document.getElementById("progressBarFill");
    const currentDictLabel = document.getElementById("currentDictLabel");
    const cardAnswerBox = document.getElementById("cardAnswerBox");
    const cardAnswerPhrase = document.getElementById("cardAnswerPhrase");
    const unmasteredBadge = document.getElementById("unmasteredBadge");
    const frontActionBar = document.getElementById("frontActionBar");
    const backActionBar = document.getElementById("backActionBar");
    const listModal = document.getElementById("listModal");

    const ALL_DICT_FILES = [
      { file: "words.json", label: "一般ビジネス", defaultCat: "COLLOCATION" },
      { file: "words-run.json", label: "基本動詞: run", defaultCat: "VERB: RUN" },
      { file: "words-take.json", label: "基本動詞: take", defaultCat: "VERB: TAKE" },
      { file: "words-get.json", label: "基本動詞: get", defaultCat: "VERB: GET" },
      { file: "words-make.json", label: "基本動詞: make", defaultCat: "VERB: MAKE" },
      { file: "words-have.json", label: "基本動詞: have", defaultCat: "VERB: HAVE" },
      { file: "words-hold.json", label: "基本動詞: hold", defaultCat: "VERB: HOLD" },
      { file: "words-give.json", label: "基本動詞: give", defaultCat: "VERB: GIVE" },
      { file: "words-verbs.json", label: "重要動詞まとめ", defaultCat: "IMPORTANT VERBS" },
      { file: "words-deck1_intransitive_100.json", label: "群動詞① 自動詞", defaultCat: "群動詞① 自動詞＋前置詞" },
      { file: "words-deck2_transitive_80.json", label: "群動詞② 他動詞", defaultCat: "群動詞② 他動詞＋O＋前置詞" },
      { file: "words-deck3_basic_100.json", label: "群動詞③ 句動詞", defaultCat: "群動詞③ 句動詞" }
    ];

    let dictionaryCache = {};

    function toggleSettingsDrawer() {
      const drawer = document.getElementById('settingsDrawer');
      drawer.classList.toggle('hidden');
    }

    async function fetchSingleDict(entry, cacheBuster) {
      if (dictionaryCache[entry.file]) return dictionaryCache[entry.file];
      try {
        const res = await fetch(entry.file + cacheBuster);
        if (!res.ok) return [];
        const raw = await res.json();
        const normalized = Array.isArray(raw) ? raw.map(item => ({
          ...item,
          category: item.category || entry.defaultCat
        })) : [];
        dictionaryCache[entry.file] = normalized;
        return normalized;
      } catch {
        return [];
      }
    }

    async function refreshTotalCounts() {
      const cacheBuster = '?t=' + new Date().getTime();
      let grandTotal = 0;
      await Promise.all(ALL_DICT_FILES.map(async (entry) => {
        const items = await fetchSingleDict(entry, cacheBuster);
        grandTotal += items.length;
        const opt = dictSelect.querySelector(`option[value="${entry.file}"]`);
        if (opt && items.length > 0) {
          opt.textContent = `${entry.label} (${items.length}語)`;
        }
      }));
      const allOpt = dictSelect.querySelector('option[value="ALL"]');
      if (allOpt && grandTotal > 0) {
        allOpt.textContent = `★ すべての辞書を結合 (全${grandTotal}語)`;
      }
    }

    async function initApp() {
      applyFontClasses();
      await refreshTotalCounts();
      await loadDictionary(dictSelect.value);
    }

    async function loadDictionary(filename) {
      const cacheBuster = '?t=' + new Date().getTime();
      try {
        let list = [];
        if (filename === "ALL") {
          const results = await Promise.all(
            ALL_DICT_FILES.map(entry => fetchSingleDict(entry, cacheBuster))
          );
          list = results.flat();
          currentDictLabel.textContent = "全辞書結合";
        } else {
          const entry = ALL_DICT_FILES.find(d => d.file === filename) || { file: filename, label: filename, defaultCat: "COLLOCATION" };
          list = await fetchSingleDict(entry, cacheBuster);
          currentDictLabel.textContent = entry.label;
        }

        currentWords = Array.isArray(list) ? list : [];
        rebuildDeck();
      } catch (err) {
        console.error("Dictionary load error:", err);
        currentWords = [];
        rebuildDeck();
      }
    }

    function changeDeckSize() {
      rebuildDeck();
    }

    function setFilterMode(mode) {
      filterMode = mode;
      const btnAll = document.getElementById('btnFilterAll');
      const btnRev = document.getElementById('btnFilterReview');

      if (mode === 'all') {
        btnAll.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#102542] text-white transition';
        btnRev.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold text-slate-500 hover:text-[#CD2D2D] transition';
      } else {
        btnRev.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-[#CD2D2D] text-white transition';
        btnAll.className = 'px-2.5 py-0.5 rounded-full text-[11px] font-bold text-slate-500 hover:text-[#102542] transition';
      }
      rebuildDeck();
    }

    function rebuildDeck() {
      let pool = [...currentWords];

      if (filterMode === 'review') {
        pool = pool.filter(item => {
          const wordText = item.front || item.word || item.phrase || item.english || "";
          return !masteredSet.has(wordText);
        });
      }

      const sizeVal = document.getElementById('deckSizeSelect').value;
      if (sizeVal !== 'all') {
        const limit = parseInt(sizeVal, 10);
        pool = pool.sort(() => Math.random() - 0.5).slice(0, limit);
      }

      activeDeck = pool;
      currentIndex = 0;
      updateUnmasteredCount();
      loadCard(0);
    }

    function updateUnmasteredCount() {
      let unmasteredCount = 0;
      currentWords.forEach(item => {
        const wordText = item.front || item.word || item.phrase || item.english || "";
        if (!masteredSet.has(wordText)) unmasteredCount++;
      });
      unmasteredBadge.textContent = unmasteredCount;
    }

    function clearTimer() {
      if (autoTimer) clearTimeout(autoTimer);
      if (countdownInterval) clearInterval(countdownInterval);
      autoTimer = null;
      countdownInterval = null;
    }

    function syncActionBars() {
      if (isFlipped) {
        frontActionBar.classList.add('hidden');
        backActionBar.classList.remove('hidden');
      } else {
        frontActionBar.classList.remove('hidden');
        backActionBar.classList.add('hidden');
      }
    }

    function loadCard(index) {
      clearTimer();
      isFlipped = false;
      flashCard.classList.remove('rotate-y-180');
      syncActionBars();
      timerStatusText.textContent = "タップで表面へ戻る";

      if (!activeDeck || activeDeck.length === 0) {
        progressIndex.textContent = "0 / 0";
        progressBarFill.style.width = "0%";
        cardCategoryBadge.textContent = "完了";
        cardWord.textContent = "対象の語彙はありません";
        cardExampleEnBack.textContent = "--";
        cardMeaning.textContent = "すべて習得済みです！";
        cardExampleJa.textContent = "設定から別の辞書や「すべて」を選んでください。";
        cardStatusBadge.classList.add('hidden');
        return;
      }

      const item = activeDeck[index];
      const wordText = item.front || item.word || item.phrase || item.english || "";
      const answerText = item.answer || "";
      const meanText = item.meaning || item.japanese || item.translation || "";
      const exEn = item.example || item.example_en || "";
      const exJa = item.example_ja || item.example_jp || "";

      cardCategoryBadge.textContent = item.category || "COLLOCATION";
      cardWord.textContent = wordText;
      cardExampleEnBack.textContent = exEn ? `"${exEn}"` : "(例文なし)";
      cardMeaning.textContent = meanText || "--";
      cardExampleJa.textContent = exJa || "--";

      // 裏面のフレーズ確認ボックス（穴埋め問題なら正解、通常なら元の英語フレーズを表示）
      cardAnswerPhrase.textContent = answerText ? answerText : wordText;

      const isMastered = masteredSet.has(wordText);
      if (!isMastered) {
        cardStatusBadge.classList.remove('hidden');
      } else {
        cardStatusBadge.classList.add('hidden');
      }

      progressIndex.textContent = `${index + 1} / ${activeDeck.length}`;
      const percent = Math.round(((index + 1) / activeDeck.length) * 100);
      progressBarFill.style.width = `${percent}%`;
    }

    function flipCard() {
      if (activeDeck.length === 0) return;
      isFlipped = !isFlipped;
      flashCard.classList.toggle('rotate-y-180', isFlipped);
      syncActionBars();

      clearTimer();

      const timerSec = parseInt(timerSelect.value, 10);
      if (isFlipped && timerSec > 0) {
        let remain = timerSec;
        timerStatusText.innerHTML = `<span class="text-[#CD2D2D] font-bold">${remain}秒後</span> に自動送り`;
        
        countdownInterval = setInterval(() => {
          remain--;
          if (remain > 0) {
            timerStatusText.innerHTML = `<span class="text-[#CD2D2D] font-bold">${remain}秒後</span> に自動送り`;
          } else {
            clearInterval(countdownInterval);
          }
        }, 1000);

        autoTimer = setTimeout(() => {
          nextCard();
        }, timerSec * 1000);
      } else {
        timerStatusText.textContent = "タップで表面へ戻る";
      }
    }

    function prevCard() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex > 0) ? currentIndex - 1 : activeDeck.length - 1;
      loadCard(currentIndex);
    }

    function nextCard() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex < activeDeck.length - 1) ? currentIndex + 1 : 0;
      loadCard(currentIndex);
    }

    function handleGrade(isMastered) {
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      const wordText = currentItem.front || currentItem.word || currentItem.phrase || currentItem.english || "";

      if (isMastered) {
        masteredSet.add(wordText);
      } else {
        masteredSet.delete(wordText);
      }
      saveMastered();
      updateUnmasteredCount();

      if (filterMode === 'review' && isMastered) {
        rebuildDeck();
      } else {
        nextCard();
      }
    }

    function adjustFontSize(delta) {
      const nextIndex = currentFontIndex + delta;
      if (nextIndex >= 0 && nextIndex < fontSizes.length) {
        currentFontIndex = nextIndex;
        localStorage.setItem('flashcard_font_level', currentFontIndex);
        applyFontClasses();
      }
    }

    function applyFontClasses() {
      const allW = fontSizes.map(f => f.split(' ')).flat();
      cardWord.classList.remove(...allW);
      cardWord.classList.add(...fontSizes[currentFontIndex].split(' '));
    }

    function playSpeech(e, forceAnswer = false) {
      if (e) e.stopPropagation();
      if (activeDeck.length === 0) return;
      const currentItem = activeDeck[currentIndex];
      let textToRead = "";
      if (currentItem.answer) {
        if (isFlipped || forceAnswer) {
          textToRead = currentItem.example || currentItem.answer;
        } else {
          textToRead = (currentItem.front || "").replace(/\(\s*\)/g, "...");
        }
      } else {
        textToRead = (isFlipped || forceAnswer)
          ? (currentItem.example || currentItem.word || currentItem.phrase || "")
          : (currentItem.word || currentItem.phrase || currentItem.front || "");
      }
      if (!textToRead) return;
      window.speechSynthesis.cancel();
      const uttr = new SpeechSynthesisUtterance(textToRead);
      uttr.lang = 'en-US';
      uttr.rate = 0.95;
      window.speechSynthesis.speak(uttr);
    }

    // スマホ左右スワイプ操作（インスタ感覚のカード送り）
    let touchStartX = 0;
    let touchStartY = 0;
    const cardTouchArea = document.getElementById('cardTouchArea');
    cardTouchArea.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    cardTouchArea.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      // 横方向の大きなスワイプのみ反応（縦スクロールやタップと区別）
      if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
        e.stopPropagation();
        if (diffX < 0) {
          nextCard(); // 左スワイプで次へ
        } else {
          prevCard(); // 右スワイプで前へ
        }
      }
    }, { passive: true });

    // 一覧モーダル
    function openListModal() {
      renderList(currentWords);
      listModal.classList.remove('hidden');
      document.getElementById('listSearchInput').value = '';
    }

    function closeListModal() {
      listModal.classList.add('hidden');
    }

    function filterList() {
      const q = document.getElementById('listSearchInput').value.toLowerCase();
      const filtered = currentWords.filter(item => {
        const w = ((item.front || item.word || item.phrase || item.english || "") + " " + (item.answer || "")).toLowerCase();
        const m = (item.meaning || item.japanese || "").toLowerCase();
        const ex = (item.example || item.example_en || "").toLowerCase();
        return w.includes(q) || m.includes(q) || ex.includes(q);
      });
      renderList(filtered);
    }

    function renderList(items) {
      const container = document.getElementById('listContainer');
      document.getElementById('modalListCount').textContent = `(${items.length} 件)`;
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 text-center py-8">該当する語彙は見つかりませんでした</p>';
        return;
      }

      items.forEach((item) => {
        const wordText = item.front || item.word || item.phrase || item.english || "";
        const meanText = item.meaning || item.japanese || "";
        const exEn = item.example || item.example_en || "";
        const isMastered = masteredSet.has(wordText);

        const row = document.createElement('div');
        row.className = 'p-3 rounded-xl bg-[#F4F7FB] border border-[#DCE4EE] space-y-1.5 hover:border-[#102542] transition cursor-pointer';
        row.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <span class="text-[10px] font-mono text-[#102542] font-bold px-2 py-0.5 rounded bg-white border border-[#DCE4EE]">
              ${item.category || 'Phrase'}
            </span>
            ${isMastered ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold">習得済</span>' : '<span class="text-[9px] px-1.5 py-0.2 rounded bg-red-50 text-[#CD2D2D] border border-red-200 font-bold">要復習</span>'}
          </div>
          <div class="text-sm font-bold text-[#102542]">${wordText} ${item.answer ? `<span class="ml-1.5 text-[11px] font-mono text-emerald-700 bg-emerald-50 border border-emerald-200 px-1.5 py-0.5 rounded">${item.answer}</span>` : ''}</div>
          <div class="text-xs font-bold text-[#CD2D2D]">${meanText}</div>
          ${exEn ? `<div class="text-[11px] text-slate-600 bg-white p-2 rounded-lg border border-[#DCE4EE] italic font-semibold">${exEn}</div>` : ''}
        `;
        row.addEventListener('click', () => {
          filterMode = 'all';
          document.getElementById('deckSizeSelect').value = 'all';
          rebuildDeck();
          const matchIndex = activeDeck.findIndex(it => (it.front || it.word || it.phrase || it.english) === wordText);
          if (matchIndex !== -1) {
            currentIndex = matchIndex;
            loadCard(currentIndex);
          }
          closeListModal();
        });
        container.appendChild(row);
      });
    }

    // イベントリスナー
    dictSelect.addEventListener("change", () => {
      loadDictionary(dictSelect.value);
      toggleSettingsDrawer(); // 選択したら自動で閉じてカード画面へ戻る
    });
    timerSelect.addEventListener("change", () => {
      clearTimer();
      if (isFlipped) flipCard();
    });
    document.getElementById("btnOpenList").addEventListener("click", openListModal);
    document.getElementById("btnCloseList").addEventListener("click", closeListModal);

    // PCキーボードショートカット
    document.addEventListener('keydown', (e) => {
      if (listModal.classList.contains('hidden')) {
        if (e.code === 'Space') { e.preventDefault(); flipCard(); }
        else if (e.code === 'ArrowUp' || e.key === '2') { e.preventDefault(); handleGrade(true); }
        else if (e.code === 'ArrowDown' || e.key === '1') { e.preventDefault(); handleGrade(false); }
        else if (e.code === 'ArrowLeft') { e.preventDefault(); prevCard(); }
        else if (e.code === 'ArrowRight') { e.preventDefault(); nextCard(); }
      }
    });

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
