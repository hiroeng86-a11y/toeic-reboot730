<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>単語・フレーズ フラッシュカード | TOEIC RE:BOOT 730</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Inter:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      background-color: #0f172a;
      color: #f1f5f9;
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="sticky top-0 z-50 bg-[#0f172a]/95 backdrop-blur border-b border-slate-700 px-4 py-3.5">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-slate-300 hover:text-amber-400 font-bold text-sm transition">
        <i class="fa-solid fa-arrow-left"></i>
        <span>ポータルへ戻る</span>
      </a>
      <span id="categoryBadge" class="text-xs font-mono font-bold text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded border border-amber-800">
        LOADING...
      </span>
    </div>
  </header>

  <!-- メインコンテナ -->
  <main class="max-w-xl mx-auto px-4 py-6 space-y-5 flex-1 w-full flex flex-col justify-center">

    <!-- コントロールバー（辞書セット選択 ＆ カテゴリー絞り込み ＆ シャッフル） -->
    <div class="space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
        <!-- 読み込む辞書ファイルの切り替え -->
        <div class="flex items-center gap-1.5 w-full sm:w-auto">
          <span class="text-slate-400 text-[11px] whitespace-nowrap"><i class="fa-solid fa-book text-amber-400 mr-1"></i>教材:</span>
          <select id="dictSelect" class="bg-slate-800 border border-slate-600 text-amber-300 font-semibold text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-amber-500 flex-1 sm:flex-none">
            <option value="ALL">★ すべての辞書を結合 (全データ)</option>
            <option value="words.json">一般ビジネス・頻出コロケーション</option>
            <option value="words-run.json">基本動詞: run</option>
            <option value="words-take.json">基本動詞: take</option>
            <option value="words-get.json">基本動詞: get</option>
            <option value="words-make.json">基本動詞: make</option>
            <option value="words-have.json">基本動詞: have</option>
            <option value="words-hold.json">基本動詞: hold</option>
            <option value="words-give.json">基本動詞: give</option>
            <option value="words-verbs.json">重要動詞まとめ (混合版)</option>
          </select>
        </div>

        <div class="flex items-center justify-between w-full sm:w-auto gap-2">
          <!-- カテゴリ絞り込み -->
          <select id="categorySelect" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-amber-500 flex-1 sm:flex-none">
            <!-- JSで動的生成 -->
          </select>
          <button id="shuffleBtn" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition whitespace-nowrap">
            <i class="fa-solid fa-shuffle text-[11px] text-amber-400"></i>
            <span>シャッフル</span>
          </button>
        </div>
      </div>

      <div class="flex justify-between items-center text-xs font-mono">
        <span id="loadStatus" class="text-slate-400 text-[11px]">読み込み待機中</span>
        <div class="font-bold text-slate-300">
          <span id="currentIndex" class="text-amber-400 text-sm">0</span> / <span id="totalCount" class="text-sm">0</span>
        </div>
      </div>
    </div>

    <!-- プログレスバー -->
    <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-amber-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- フラッシュカード（スマホで高さ350px、PCで384pxを確保） -->
    <div class="perspective-1000 w-full h-[350px] sm:h-96 cursor-pointer" id="cardContainer">
      <div id="cardInner" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-2xl">
        
        <!-- 表面 -->
        <div class="absolute inset-0 w-full h-full bg-[#1e293b] border border-slate-700 rounded-3xl p-6 sm:p-8 flex flex-col justify-between backface-hidden shadow-lg">
          <div class="flex justify-between items-start">
            <span id="cardTag" class="text-[11px] font-mono font-bold tracking-wider text-slate-400 bg-slate-900/80 px-2.5 py-1 rounded-md border border-slate-800">
              CATEGORY
            </span>
            <span class="text-xs text-slate-500 flex items-center gap-1">
              <i class="fa-solid fa-rotate text-[11px]"></i> タップで意味を表示
            </span>
          </div>

          <div class="text-center my-auto px-2">
            <h2 id="cardTerm" class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide leading-tight">
              Loading...
            </h2>
          </div>

          <div class="text-center">
            <span class="text-xs font-semibold text-amber-400/90 tracking-widest uppercase">
              Click to reveal meaning &amp; example
            </span>
          </div>
        </div>

        <!-- 裏面 -->
        <div class="absolute inset-0 w-full h-full bg-gradient-to-br from-slate-900 to-[#1e293b] border border-amber-500/40 rounded-3xl p-5 sm:p-7 flex flex-col justify-between backface-hidden rotate-y-180 shadow-lg overflow-y-auto">
          <div class="flex justify-between items-start">
            <span class="text-[11px] font-mono font-bold tracking-wider text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded-md border border-amber-800">
              MEANING &amp; CONTEXT
            </span>
            <span class="text-xs text-slate-500 flex items-center gap-1">
              <i class="fa-solid fa-rotate text-[11px]"></i> 戻す
            </span>
          </div>

          <div class="space-y-3 my-auto text-left py-2">
            <div>
              <p class="text-[11px] text-slate-400 font-bold mb-0.5">日本語訳</p>
              <p id="cardMeaning" class="text-lg sm:text-xl font-bold text-amber-300 leading-snug">
                --
              </p>
            </div>
            <div id="exampleBox" class="bg-slate-950/70 p-3 rounded-xl border border-slate-800/80 text-xs sm:text-sm space-y-1">
              <p class="text-[10px] text-slate-500 font-mono font-bold uppercase">例文</p>
              <p id="cardExample" class="text-slate-200 font-medium leading-relaxed">--</p>
              <p id="cardExampleJp" class="text-slate-400 text-xs pt-1 border-t border-slate-800/80 leading-relaxed">--</p>
            </div>
          </div>

          <div class="text-center text-xs text-slate-500">
            タップで表面に戻ります
          </div>
        </div>

      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="grid grid-cols-2 gap-3 pt-2">
      <button id="prevBtn" class="py-3.5 px-4 rounded-2xl bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 text-slate-200 font-bold text-sm transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>前の表現</span>
      </button>
      <button id="nextBtn" class="py-3.5 px-4 rounded-2xl bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 font-black text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
        <span>次の表現</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </div>

    <p class="text-[11px] text-center text-slate-500 pt-1">
      キーボード操作：[Space] めくる / [←][→] 前後移動
    </p>

  </main>

  <footer class="text-center text-xs text-slate-600 py-4 border-t border-slate-800">
    <p>&copy; 2026 TOEIC RE:BOOT 730 Flashcard Lab</p>
  </footer>

  <script>
    // 登録されている辞書ファイル一覧
    const ALL_JSON_FILES = [
      "words.json",
      "words-run.json",
      "words-take.json",
      "words-get.json",
      "words-make.json",
      "words-have.json",
      "words-hold.json",
      "words-give.json"
    ];

    let loadedDatabase = [];
    let currentList = [];
    let cardIdx = 0;
    let isFlipped = false;

    // DOM要素
    const cardContainer = document.getElementById("cardContainer");
    const cardInner = document.getElementById("cardInner");
    const cardTag = document.getElementById("cardTag");
    const cardTerm = document.getElementById("cardTerm");
    const cardMeaning = document.getElementById("cardMeaning");
    const cardExample = document.getElementById("cardExample");
    const cardExampleJp = document.getElementById("cardExampleJp");
    const currentIndexEl = document.getElementById("currentIndex");
    const totalCountEl = document.getElementById("totalCount");
    const progressBar = document.getElementById("progressBar");
    const dictSelect = document.getElementById("dictSelect");
    const categorySelect = document.getElementById("categorySelect");
    const categoryBadge = document.getElementById("categoryBadge");
    const loadStatus = document.getElementById("loadStatus");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    // 辞書ファイルを fetch で読み込む関数
    async function loadDictionary(target) {
      loadStatus.textContent = "データを読み込み中...";
      loadStatus.className = "text-amber-400 text-[11px] animate-pulse";
      loadedDatabase = [];

      try {
        if (target === "ALL") {
          // すべての辞書を並列取得して結合
          const results = await Promise.allSettled(
            ALL_JSON_FILES.map(file => fetch(file).then(r => {
              if (!r.ok) throw new Error(`${file} not found`);
              return r.json();
            }))
          );

          results.forEach((res, i) => {
            if (res.status === "fulfilled" && Array.isArray(res.value)) {
              loadedDatabase.push(...res.value);
            } else {
              console.warn(`Failed to load: ${ALL_JSON_FILES[i]}`);
            }
          });
        } else {
          // 単一ファイルの読み込み
          const res = await fetch(target);
          if (!res.ok) throw new Error(`${target} の取得に失敗しました (HTTP ${res.status})`);
          loadedDatabase = await res.json();
        }

        if (!Array.isArray(loadedDatabase) || loadedDatabase.length === 0) {
          throw new Error("有効な単語データが見つかりませんでした");
        }

        loadStatus.textContent = `読込完了: ${loadedDatabase.length}件`;
        loadStatus.className = "text-emerald-400 text-[11px]";

        initCategories();
        cardIdx = 0;
        updateCard();

      } catch (err) {
        console.error(err);
        loadStatus.textContent = `エラー: ${err.message}`;
        loadStatus.className = "text-rose-400 text-[11px]";
        cardTerm.textContent = "読み込みエラー";
        cardMeaning.textContent = "辞書JSONファイルの読み込みに失敗しました。ファイルが同階層にあるか確認してください。";
        cardExample.textContent = err.message;
        cardExampleJp.textContent = "";
        totalCountEl.textContent = "0";
        currentIndexEl.textContent = "0";
      }
    }

    // カテゴリー選択肢の生成
    function initCategories() {
      const categories = [...new Set(loadedDatabase.map(item => item.category || "未分類"))];
      categorySelect.innerHTML = `<option value="all">全カテゴリ (${loadedDatabase.length})</option>`;
      categories.forEach(cat => {
        const count = loadedDatabase.filter(item => (item.category || "未分類") === cat).length;
        categorySelect.innerHTML += `<option value="${cat}">${cat} (${count})</option>`;
      });
      currentList = [...loadedDatabase];
      categoryBadge.textContent = `全 ${currentList.length} 件`;
    }

    // カード表示更新
    function updateCard() {
      if (currentList.length === 0) {
        cardTerm.textContent = "該当する表現がありません";
        cardMeaning.textContent = "--";
        cardExample.textContent = "--";
        cardExampleJp.textContent = "--";
        cardTag.textContent = "NONE";
        currentIndexEl.textContent = 0;
        totalCountEl.textContent = 0;
        progressBar.style.width = "0%";
        return;
      }

      if (isFlipped) {
        cardInner.classList.remove("rotate-y-180");
        isFlipped = false;
      }

      const item = currentList[cardIdx];
      cardTag.textContent = item.category || "基本表現";
      cardTerm.textContent = item.word || "No Word";
      cardMeaning.textContent = item.meaning || "--";
      cardExample.textContent = item.example || "No example sentence.";
      
      // example_jp が無い辞書データへの配慮
      if (item.example_jp && item.example_jp.trim() !== "") {
        cardExampleJp.textContent = item.example_jp;
        cardExampleJp.classList.remove("hidden");
      } else {
        cardExampleJp.textContent = "";
        cardExampleJp.classList.add("hidden");
      }

      currentIndexEl.textContent = cardIdx + 1;
      totalCountEl.textContent = currentList.length;

      const progress = ((cardIdx + 1) / currentList.length) * 100;
      progressBar.style.width = progress + "%";
    }

    function flipCard() {
      isFlipped = !isFlipped;
      cardInner.classList.toggle("rotate-y-180", isFlipped);
    }

    function nextCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx + 1) % currentList.length;
      updateCard();
    }

    function prevCard() {
      if (currentList.length === 0) return;
      cardIdx = (cardIdx - 1 + currentList.length) % currentList.length;
      updateCard();
    }

    // イベントリスナー
    cardContainer.addEventListener("click", flipCard);
    nextBtn.addEventListener("click", (e) => { e.stopPropagation(); nextCard(); });
    prevBtn.addEventListener("click", (e) => { e.stopPropagation(); prevCard(); });

    // 教材（辞書ファイル）の変更時
    dictSelect.addEventListener("change", (e) => {
      loadDictionary(e.target.value);
    });

    // カテゴリー絞り込み
    categorySelect.addEventListener("change", (e) => {
      const selected = e.target.value;
      if (selected === "all") {
        currentList = [...loadedDatabase];
        categoryBadge.textContent = `全 ${currentList.length} 件`;
      } else {
        currentList = loadedDatabase.filter(item => (item.category || "未分類") === selected);
        categoryBadge.textContent = selected;
      }
      cardIdx = 0;
      updateCard();
    });

    // シャッフル
    shuffleBtn.addEventListener("click", () => {
      for (let i = currentList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentList[i], currentList[j]] = [currentList[j], currentList[i]];
      }
      cardIdx = 0;
      updateCard();
    });

    // キーボード操作
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        flipCard();
      } else if (e.code === "ArrowRight") {
        e.preventDefault();
        nextCard();
      } else if (e.code === "ArrowLeft") {
        e.preventDefault();
        prevCard();
      }
    });

    // 初回起動：全辞書を自動ロード
    document.addEventListener("DOMContentLoaded", () => {
      loadDictionary("ALL");
    });
  </script>
</body>
</html>
