<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知の防衛戦！クイズ戦隊ナゾレンジャー</title>
<style>
  :root {
    --bg-color: #121826;
    --card-bg: #1e293b;
    --text-color: #f8fafc;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-yellow: #f59e0b;
    --accent-purple: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  #game-container {
    background: var(--card-bg);
    width: 100%;
    max-width: 650px;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    text-align: center;
  }
  .hidden { display: none !important; }
  h1 { font-size: 1.8rem; margin-bottom: 16px; color: #fbbf24; }
  p { margin-bottom: 20px; line-height: 1.6; }
  
  /* ボタン全般 */
  button {
    background: #334155;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { filter: brightness(1.2); }

  /* ステータスバー（ライフ・進捗） */
  .status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-weight: bold;
    font-size: 1.1rem;
  }
  .life-display { color: #f43f5e; font-size: 1.3rem; letter-spacing: 2px; }

  /* クイズ画面 */
  .enemy-box {
    margin-bottom: 16px;
    padding: 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border-left: 6px solid #ccc;
  }
  .enemy-name { font-size: 1.2rem; font-weight: bold; }
  .timer-bar {
    height: 8px;
    background: #475569;
    border-radius: 4px;
    overflow: hidden;
    margin: 16px 0;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: #38bdf8;
    transition: width 0.1s linear;
  }
  .question-text {
    font-size: 1.15rem;
    font-weight: bold;
    min-height: 50px;
    margin-bottom: 20px;
    text-align: left;
    line-height: 1.5;
  }
  .choices-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 500px) {
    .choices-grid { grid-template-columns: 1fr; }
  }
  .choice-btn {
    text-align: left;
    background: #334155;
    padding: 14px;
    font-size: 0.95rem;
    line-height: 1.4;
  }
  
  /* リザルト・演出 */
  .feedback {
    font-size: 1.15rem;
    font-weight: bold;
    margin-top: 16px;
    min-height: 28px;
  }
</style>
</head>
<body>

<div id="game-container">
  <!-- 1. オープニング画面 -->
  <div id="screen-title">
    <h1>知の防衛戦！<br>逆襲のクイズ戦隊ナゾレンジャー</h1>
    <p>突如地球に現れた「クイズ戦隊ナゾレンジャー」！<br>
    5人の戦士が放つ難問を解き明かし、世界に平和を取り戻せ！<br><br>
    ・制限時間は各問20秒<br>
    ・各エリア3問突破で幹部撃破（全5エリア）<br>
    ・ライフは3機（3回間違えるとゲームオーバー）</p>
    <button id="btn-start" style="font-size: 1.2rem; background: #2563eb;">戦いを開始する</button>
  </div>

  <!-- 2. 戦闘（クイズ）画面 -->
  <div id="screen-battle" class="hidden">
    <div class="status-header">
      <div id="stage-info" style="color: #94a3b8;">STAGE 1 / 5</div>
      <div>残りLIFE: <span id="life-icons" class="life-display">❤❤❤</span></div>
    </div>

    <div id="enemy-box" class="enemy-box">
      <div id="enemy-name" class="enemy-name">怪人名</div>
      <div id="enemy-phrase" style="font-size: 0.9rem; margin-top: 4px;">セリフ</div>
    </div>
    
    <div style="font-size: 0.95rem;">残り時間: <span id="timer-text" style="font-weight: bold;">20</span> 秒</div>
    <div class="timer-bar"><div id="timer-fill" class="timer-fill"></div></div>

    <div id="question-text" class="question-text">問題文</div>
    
    <div class="choices-grid">
      <button class="choice-btn" onclick="selectAnswer(0)"></button>
      <button class="choice-btn" onclick="selectAnswer(1)"></button>
      <button class="choice-btn" onclick="selectAnswer(2)"></button>
      <button class="choice-btn" onclick="selectAnswer(3)"></button>
    </div>
    <div id="feedback" class="feedback"></div>
  </div>

  <!-- 3. ゲームオーバー画面 -->
  <div id="screen-gameover" class="hidden">
    <h1 style="color: var(--accent-red);">GAME OVER</h1>
    <p id="gameover-msg">ナゾレンジャーの圧倒的な知識の前に屈してしまった……。</p>
    <button onclick="startGame()">最初からやり直す</button>
  </div>

  <!-- 4. エンディング画面 -->
  <div id="screen-clear" class="hidden">
    <h1 style="color: #4ade80;">VICTORY!!</h1>
    <p>ナゾレンジャー5人を全員撃破した！<br>
    あなたの圧倒的な閃きと知識が、地球の平和を守り抜いたのだ！<br>
    ゲームクリア、おめでとう！</p>
    <button onclick="startGame()">もう一度挑戦する</button>
  </div>
</div>

<script>
// --- 戦隊メンバー ---

  { genre: "sports", name: "スポーツグリーン", color: "var(--accent-green)", intro: "「頭脳の反射神経を見せてみろ！熱き戦いだ！」" },
  { genre: "game", name: "ゲームイエロー", color: "var(--accent-yellow)", intro: "「遊びの達人に勝てるかな？全問パーフェクトを狙え！」" },
  { genre: "pc", name: "PCパープル", color: "var(--accent-purple)", intro: "「0と1の狭間に沈め……デジタルの試練をパスせよ。」" }

// --- ゲーム設定 ---
const QUESTIONS_PER_STAGE = 3;
const TIME_LIMIT = 20;
const MAX_LIVES = 3;

let currentStageIndex = 0;
let currentQuestionIndex = 0;
let lives = MAX_LIVES;
let stageQuestions = [];
let currentShuffledChoices = [];
let correctShuffledIndex = 0;

let timer = null;
let timeLeft = TIME_LIMIT;
let acceptingInput = false;

// 画面要素
const screens = {
  title: document.getElementById('screen-title'),
  battle: document.getElementById('screen-battle'),
  gameover: document.getElementById('screen-gameover'),
  clear: document.getElementById('screen-clear')
};

document.getElementById('btn-start').onclick = startGame;

function setScreen(screenName) {
  Object.keys(screens).forEach(key => screens[key].classList.add('hidden'));
  screens[screenName].classList.remove('hidden');
}

// 開始ミリ秒時刻に基づく高品質シャッフル（Fisher-Yates法）
function shuffleWithTime(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const seed = (Date.now() * (i + 1) + Math.floor(Math.random() * 100000)) % 10000;
    const j = Math.floor((seed / 10000) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function updateLifeUI() {
  let hearts = "";
  for (let i = 0; i < MAX_LIVES; i++) {
    hearts += i < lives ? "❤" : "🖤";
  }
  document.getElementById('life-icons').innerText = hearts;
}

function startGame() {
  currentStageIndex = 0;
  lives = MAX_LIVES;
  updateLifeUI();
  startStage();
}

function startStage() {
  const stage = STAGES[currentStageIndex];
  currentQuestionIndex = 0;
  
  // 開始時刻を元にシャッフルして3問を抽出
  const pool = QUIZ_DATA[stage.genre];
  stageQuestions = shuffleWithTime(pool).slice(0, QUESTIONS_PER_STAGE);

  // ステージ演出
  document.getElementById('stage-info').innerText = `STAGE ${currentStageIndex + 1} / 5 [${stage.name}]`;
  document.getElementById('enemy-name').innerText = stage.name;
  document.getElementById('enemy-phrase').innerText = stage.intro;
  document.getElementById('enemy-box').style.borderColor = stage.color;

  setScreen('battle');
  showQuestion();
}

function showQuestion() {
  acceptingInput = true;
  document.getElementById('feedback').innerText = "";
  
  const qData = stageQuestions[currentQuestionIndex];
  document.getElementById('question-text').innerText = `Q${currentQuestionIndex + 1}. ${qData.q}`;
  
  // 選択肢のシャッフル処理
  const choiceObjects = qData.c.map((text, idx) => ({ text, isCorrect: idx === qData.a }));
  currentShuffledChoices = shuffleWithTime(choiceObjects);
  correctShuffledIndex = currentShuffledChoices.findIndex(item => item.isCorrect);

  const choiceBtns = document.querySelectorAll('.choice-btn');
  choiceBtns.forEach((btn, index) => {
    btn.innerText = `${index + 1}. ${currentShuffledChoices[index].text}`;
    btn.style.background = "#334155";
  });

  // タイマー開始
  timeLeft = TIME_LIMIT;
  updateTimerUI();
  clearInterval(timer);
  timer = setInterval(countDown, 100);
}

function countDown() {
  timeLeft -= 0.1;
  if (timeLeft <= 0) {
    timeLeft = 0;
    clearInterval(timer);
    timeUp();
  }
  updateTimerUI();
}

function updateTimerUI() {
  document.getElementById('timer-text').innerText = Math.ceil(timeLeft);
  const percent = (timeLeft / TIME_LIMIT) * 100;
  document.getElementById('timer-fill').style.width = `${percent}%`;
}

function selectAnswer(choiceIdx) {
  if (!acceptingInput) return;
  acceptingInput = false;
  clearInterval(timer);

  const choiceBtns = document.querySelectorAll('.choice-btn');

  if (choiceIdx === correctShuffledIndex) {
    document.getElementById('feedback').innerText = "〇 正解！撃破へ一歩前進！";
    document.getElementById('feedback').style.color = "#4ade80";
    choiceBtns[choiceIdx].style.background = "#15803d";
    setTimeout(nextProgress, 1200);
  } else {
    handleMistake(choiceIdx);
  }
}

function timeUp() {
  acceptingInput = false;
  handleMistake(-1);
}

function handleMistake(wrongIdx) {
  lives--;
  updateLifeUI();

  const choiceBtns = document.querySelectorAll('.choice-btn');
  if (wrongIdx >= 0) {
    choiceBtns[wrongIdx].style.background = "#b91c1c";
  }
  choiceBtns[correctShuffledIndex].style.background = "#15803d";

  if (lives > 0) {
    const reason = wrongIdx === -1 ? "時間切れ！" : "不正解！";
    document.getElementById('feedback').innerText = `× ${reason} 残りライフ: ${lives}`;
    document.getElementById('feedback').style.color = "#ef4444";
    // 間違えてもライフがあればそのまま次の問題へ進む
    setTimeout(nextProgress, 1500);
  } else {
    document.getElementById('feedback').innerText = "× ライフが尽きてしまった……！";
    document.getElementById('feedback').style.color = "#ef4444";
    setTimeout(gameOver, 1500);
  }
}

function nextProgress() {
  currentQuestionIndex++;
  if (currentQuestionIndex < QUESTIONS_PER_STAGE) {
    showQuestion();
  } else {
    // 幹部撃破
    currentStageIndex++;
    if (currentStageIndex < STAGES.length) {
      startStage();
    } else {
      // 5ステージ走破でエンディング
      setScreen('clear');
    }
  }
}

function gameOver() {
  const stage = STAGES[currentStageIndex];
  document.getElementById('gameover-msg').innerText = `${stage.name}の猛攻により知識エネルギーが尽きてしまった……！`;
  setScreen('gameover');
}
</script>
